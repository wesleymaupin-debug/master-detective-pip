      --btn-hover: #293860;
      --font: 'Lexend', sans-serif;
      --size: 1.22rem;

    body.theme-parchment {

      --card-bg: #ffffff;
      --text: #2c2317;
      --text-muted: #78654c;
      --gold: #b45309;
      --cyan: #0e7490;
      --border: #e6dac1;
      --btn-bg: #f3ebd7;
      --btn-hover: #e8dcc3;

      --text: #d1fae5;
      --text-muted: #6ee7b7;

      --cyan: #22d3ee;
      --border: #264a3c;
      --btn-bg: #1f382d;
      --btn-hover: #2a4c3e;

      word-spacing: 0.12em;
    }

    body.font-serif {

      letter-spacing: normal;
      word-spacing: normal;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {

      color: var(--text);
      font-family: var(--font);
      font-size: var(--size);

      overflow-x: hidden;
      padding-bottom: 90px;

      z-index: 1000;

      border-bottom: 2px solid var(--gold);

      display: flex;
      justify-content: space-between;

      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      font-weight: 800;

      align-items: center;
      gap: 8px;
    }

    .controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .ctrl-btn {
      background: var(--btn-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      cursor: pointer;
      font-family: var(--font);
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .ctrl-btn:hover {
      background: var(--btn-hover);
      border-color: var(--gold);
      transform: translateY(-1px);
    }
    .ctrl-btn.active {
      background: var(--gold);
      color: #0c101c;
      font-weight: 700;
      border-color: var(--gold);
    }

    .tints {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 4px;
    }

      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.15s;

    .tint-dot:hover { transform: scale(1.15); }
    .tint-dot.active { border-color: var(--gold); }

    /* Reading Focus Ruler */
    #ruler-box {
      display: none;
      position: fixed;
      left: 0;
      width: 100vw;
      height: 54px;
      pointer-events: none;
      z-index: 900;
      background: rgba(245, 158, 11, 0.08);
      border-top: 2px dashed rgba(245, 158, 11, 0.65);
      border-bottom: 2px dashed rgba(245, 158, 11, 0.65);
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.58);
    }

    /* Main Container */
    .container {
      max-width: 860px;
      margin: 20px auto;
      padding: 0 16px;
    }

    /* Chapter Quick Jump Selector Bar */
    .chapter-nav {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 10px 0;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

      background: var(--btn-bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;

    .ch-tab:hover {
      color: var(--text);
      border-color: var(--gold);
    }
    .ch-tab.active {

      color: #0c101c;
      font-weight: 700;
      border-color: var(--gold);
    }

    .scene-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
      margin-bottom: 25px;
    }

    .scene-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .ch-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--cyan);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .scene-title {
      font-family: 'Cinzel', serif;
      font-size: 1.85rem;
      color: var(--gold);
      margin-bottom: 16px;
      line-height: 1.25;
    }

    /* Full-Cast Audio Narration Action Bar */
    .audio-bar {
      background: rgba(6, 182, 212, 0.08);
      border: 1px solid rgba(6, 182, 212, 0.25);
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 22px;
    }
    .audio-top-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .audio-btn {
      background: linear-gradient(135deg, var(--gold), #ea580c);
      color: #0c101c;
      border: none;
      border-radius: 8px;
      padding: 9px 18px;
      font-family: var(--font);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.15s;
    }
    .audio-btn:hover { transform: scale(1.03); }
    .audio-btn.speaking {
      background: #ef4444 !important;
      color: #ffffff !important;
    }

    .voice-mode-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: var(--gold);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .audio-bottom-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px dashed var(--border);
      padding-top: 10px;
    }

    .active-speaker-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      color: var(--cyan);
    }

      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-family: var(--font);
      font-size: 0.82rem;
      max-width: 240px;
      cursor: pointer;

    .image-box {

      margin-bottom: 20px;
      line-height: var(--line-height);

      border-radius: 4px;

    .speaker-pip {

      border-bottom: 2px dotted #f59e0b;

    .speaker-titan {

      font-weight: 700;

      font-style: italic;

      border-bottom: 2px dotted #10b981;
    }
    .speaker-barnaby {
      color: #fdba74;
      border-bottom: 2px solid #f97316;
      font-weight: 600;
    }
    .speaker-hero {
      color: #67e8f9;
      font-weight: 600;

      border-radius: 4px;
      padding: 3px 6px;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.6);

    .choice-container {
      margin-top: 26px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;

    .btn-choice {
      background: var(--btn-bg);
      border: 2px solid var(--border);
      color: var(--text);
      padding: 14px 20px;
      border-radius: 12px;
      font-family: var(--font);
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 12px;

    .btn-choice:hover {
      background: var(--btn-hover);
      border-color: var(--gold);

      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.25);

      color: #0c101c;
      font-weight: 800;
      padding: 4px 10px;

    }
  </style>

ickered with bright red numbers: DEC 25.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Along the baseline, a dozen children stood in a nervous line. At the front of the line, your best friends, Maya and Leo, were huddled together in their winter coats.", "segments": [{"text": "Along the baseline, a dozen children stood in a nervous line. At the front of the line, your best friends, Maya and Leo, were huddled together in their winter coats.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Hey!\" you whisper, slipping up behind them. \"Maya! Leo! What is going on?\"", "segments": [{"text": "Hey!", "speaker": "hero", "is_quote": true}, {"text": "you whisper, slipping up behind them.", "speaker": "narrator", "is_quote": false}, {"text": "Maya! Leo! What is going on?", "speaker": "hero", "is_quote": true}]}, {"raw": "Maya turns, her eyes wide with panic. \"They rounded up everyone who didn't come out of their houses to sing carols! They said we have an acute case of 'Holiday Irregularity'!\"", "segments": [{"text": "Maya turns, her eyes wide with panic.", "speaker": "narrator", "is_quote": false}, {"text": "They rounded up everyone who didn't come out of their houses to sing carols! They said we have an acute case of 'Holiday Irregularity'!", "speaker": "maya", "is_quote": true}]}, {"raw": "\"They're putting people in front of that thing,\" Leo whispers, pointing a shaking mitten toward the center court.", "segments": [{"text": "They're putting people in front of that thing,", "speaker": "narrator", "is_quote": true}, {"text": "Leo whispers, pointing a shaking mitten toward the center court.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Where the center jump circle used to be sat a massive iron stove—the Cheer Hearth. Its copper pipes rattled and hissed, venting sweet-smelling, glittery lavender steam into the gym rafters. Inside the hearth, a flame danced with a strange, hypnotic purple-and-gold glow.", "segments": [{"text": "Where the center jump circle used to be sat a massive iron stove—the Cheer Hearth. Its copper pipes rattled and hissed, venting sweet-smelling, glittery lavender steam into the gym rafters. Inside the hearth, a flame danced with a strange, hypnotic purple-and-gold glow.", "speaker": "narrator", "is_quote": false}]}, {"raw": "A towering Nutcracker commander with brass epaulets slammed his wooden staff onto the floor.", "segments": [{"text": "A towering Nutcracker commander with brass epaulets slammed his wooden staff onto the floor.", "speaker": "narrator", "is_quote": false}]}, {"raw": "THUMP!", "segments": [{"text": "THUMP!", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"NEXT CITIZEN,\" the commander boomed, his painted wooden lips snapping open and shut. \"PROCEED TO THE CHEER HEARTH TO RESTORE MANDATORY FESTIVE SPIRIT.\"", "segments": [{"text": "NEXT CITIZEN,", "speaker": "soldier", "is_quote": true}, {"text": "the commander boomed, his painted wooden lips snapping open and shut.", "speaker": "narrator", "is_quote": false}, {"text": "PROCEED TO THE CHEER HEARTH TO RESTORE MANDATORY FESTIVE SPIRIT.", "speaker": "soldier", "is_quote": true}]}, {"raw": "Two wooden guards grabbed Maya by the elbows.", "segments": [{"text": "Two wooden guards grabbed Maya by the elbows.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Wait! Let go of me!\" Maya cried, pulling back. \"Today is Thanksgiving! I'm supposed to visit my grandma!\"", "segments": [{"text": "Wait! Let go of me!", "speaker": "maya", "is_quote": true}, {"text": "Maya cried, pulling back.", "speaker": "narrator", "is_quote": false}, {"text": "Today is Thanksgiving! I'm supposed to visit my grandma!", "speaker": "maya", "is_quote": true}]}, {"raw": "The guards didn't blink. They forced Maya onto a small brass stool directly in front of the swirling purple fire.", "segments": [{"text": "The guards didn't blink. They forced Maya onto a small brass stool directly in front of the swirling purple fire.", "speaker": "narrator", "is_quote": false}]}], "image": {"src": "images/chapter1_illustration2_merriment_processing_station_1795373991413.jpg", "alt": "Illustration: The Reprogrammed Gym"}, "choices": [{"id": "c1p2_next", "label": {"standard": "Turn the page", "short": "Turn the page"}, "goto": "c1p3"}]}, "c1p3": {"id": "c1p3", "chapter": 1, "chapter_title": "The Vanishing Season", "title": "The Fade", "paragraphs": [{"raw": "\"Maya!\" you shout, taking a step forward, but a wooden bayonet snaps down, blocking your path.", "segments": [{"text": "Maya!", "speaker": "hero", "is_quote": true}, {"text": "you shout, taking a step forward, but a wooden bayonet snaps down, blocking your path.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"OBSERVE,\" the Nutcracker guard rattles. \"THE SPIRIT RESTORATION IS COMMENCING.\"", "segments": [{"text": "OBSERVE,", "speaker": "soldier", "is_quote": true}, {"text": "the Nutcracker guard rattles.", "speaker": "narrator", "is_quote": false}, {"text": "THE SPIRIT RESTORATION IS COMMENCING.", "speaker": "soldier", "is_quote": true}]}, {"raw": "The lavender smoke from the hearth coiled gently around Maya’s face like warm ribbons. For a second, she squeezed her eyes shut, fighting it. You could see her trying to hold on to her memories—trying to remember her family, her grandma, the world that was here just yesterday.", "segments": [{"text": "The lavender smoke from the hearth coiled gently around Maya’s face like warm ribbons. For a second, she squeezed her eyes shut, fighting it. You could see her trying to hold on to her memories—trying to remember her family, her grandma, the world that was here just yesterday.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Then, her shoulders relaxed.", "segments": [{"text": "Then, her shoulders relaxed.", "speaker": "narrator", "is_quote": false}]}, {"raw": "The fear in her face melted away. Her eyes opened, but the spark in them was gone, replaced by a smooth, glossy reflection of the purple flame.", "segments": [{"text": "The fear in her face melted away. Her eyes opened, but the spark in them was gone, replaced by a smooth, glossy reflection of the purple flame.", "speaker": "narrator", "is_quote": false}]}, {"raw": "A calm, gentle smile spread across her lips.", "segments": [{"text": "A calm, gentle smile spread across her lips.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Maya?\" you whisper, your voice trembling. \"Do you hear me?\"", "segments": [{"text": "Maya?", "speaker": "hero", "is_quote": true}, {"text": "you whisper, your voice trembling.", "speaker": "narrator", "is_quote": false}, {"text": "Do you hear me?", "speaker": "hero", "is_quote": true}]}, {"raw": "Maya looked straight at you, blinking slowly. Her voice was smooth and polite, like someone reciting lines from a holiday greeting card.", "segments": [{"text": "Maya looked straight at you, blinking slowly. Her voice was smooth and polite, like someone reciting lines from a holiday greeting card.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Why are you looking so worried?\" she asked pleasantly. \"Isn't it wonderful? It's Christmas. We're going to open presents all day.\"", "segments": [{"text": "Why are you looking so worried?", "speaker": "maya", "is_quote": true}, {"text": "she asked pleasantly.", "speaker": "narrator", "is_quote": false}, {"text": "Isn't it wonderful? It's Christmas. We're going to open presents all day.", "speaker": "maya", "is_quote": true}]}, {"raw": "\"No, Maya, listen to me,\" you plead. \"It’s Thanksgiving. Think about yesterday!\"", "segments": [{"text": "No, Maya, listen to me,", "speaker": "hero", "is_quote": true}, {"text": "you plead.", "speaker": "narrator", "is_quote": false}, {"text": "It’s Thanksgiving. Think about yesterday!", "speaker": "hero", "is_quote": true}]}, {"raw": "Maya let out a soft, tinkling laugh that made the hair on your arms stand up.", "segments": [{"text": "Maya let out a soft, tinkling laugh that made the hair on your arms stand up.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Yesterday? There is no yesterday. There is only Christmas.\"", "segments": [{"text": "Yesterday? There is no yesterday. There is only Christmas.", "speaker": "narrator", "is_quote": true}]}, {"raw": "The commander stepped forward, stamping Maya's hand with a glowing red snowflake ink stamp. \"PROCESSED. ASSIGN CITIZEN TO REINDEER CRAFTS.\"", "segments": [{"text": "The commander stepped forward, stamping Maya's hand with a glowing red snowflake ink stamp.", "speaker": "narrator", "is_quote": false}, {"text": "PROCESSED. ASSIGN CITIZEN TO REINDEER CRAFTS.", "speaker": "soldier", "is_quote": true}]}, {"raw": "The commander slowly turned his painted, unblinking black eyes toward you.", "segments": [{"text": "The commander slowly turned his painted, unblinking black eyes toward you.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"NEXT SUBJECT,\" the commander clicked. \"YOU ARE DEMONSTRATING SEVERE CHEER RESISTANCE. STEP FORWARD.\"", "segments": [{"text": "NEXT SUBJECT,", "speaker": "soldier", "is_quote": true}, {"text": "the commander clicked.", "speaker": "narrator", "is_quote": false}, {"text": "YOU ARE DEMONSTRATING SEVERE CHEER RESISTANCE. STEP FORWARD.", "speaker": "soldier", "is_quote": true}]}, {"raw": "You look at the glowing hearth. You feel a strange hum in the back of your mind—a quiet, stubborn voice telling you that you are different. The magic that took Maya’s memories washes against your thoughts, but it doesn't take hold. It slides off like water on glass.", "segments": [{"text": "You look at the glowing hearth. You feel a strange hum in the back of your mind—a quiet, stubborn voice telling you that you are different. The magic that took Maya’s memories washes against your thoughts, but it doesn't take hold. It slides off like water on glass.", "speaker": "narrator", "is_quote": false}]}, {"raw": "You remember the truth. And if you go up to that hearth, there's no telling if you can hold on to it.", "segments": [{"text": "You remember the truth. And if you go up to that hearth, there's no telling if you can hold on to it.", "speaker": "narrator", "is_quote": false}]}, {"raw": "You need to run. Now.", "segments": [{"text": "You need to run. Now.", "speaker": "narrator", "is_quote": false}]}], "image": {"src": "images/chapter_1_the_fade_friend_turned_1795376550143.jpg", "alt": "Illustration: The Fade — The Friend Being Turned"}, "choices": [{"id": "c1p3_next", "label": {"standard": "Turn the page", "short": "Turn the page"}, "goto": "c1p4"}]}, "c1p4": {"id": "c1p4", "chapter": 1, "chapter_title": "The Vanishing Season", "title": "The Breakout", "paragraphs": [{"raw": "The wooden guards step toward you, their joints creaking in rhythm. Clack-clack. Clack-clack.", "segments": [{"text": "The wooden guards step toward you, their joints creaking in rhythm. Clack-clack. Clack-clack.", "speaker": "narrator", "is_quote": false}]}, {"raw": "You have about three seconds before wooden hands grab your coat. You scan the gymnasium for a way out:", "segments": [{"text": "You have about three seconds before wooden hands grab your coat. You scan the gymnasium for a way out:", "speaker": "narrator", "is_quote": false}]}, {"raw": "The three soldiers closing in have little copper gears visible behind their ears, twitching in sync with the holiday music.", "segments": [{"text": "The three soldiers closing in have little copper gears visible behind their ears, twitching in sync with the holiday music.", "speaker": "narrator", "is_quote": false}]}, {"raw": "To your left, the shadow under the folded wooden bleachers offers a low crawl space toward the equipment room.", "segments": [{"text": "To your left, the shadow under the folded wooden bleachers offers a low crawl space toward the equipment room.", "speaker": "narrator", "is_quote": false}]}, {"raw": "To your right, a twenty-foot pyramid of oversized, red-and-gold gift boxes stands directly between you and the side emergency exit.", "segments": [{"text": "To your right, a twenty-foot pyramid of oversized, red-and-gold gift boxes stands directly between you and the side emergency exit.", "speaker": "narrator", "is_quote": false}]}, {"raw": "What do you do?", "segments": [{"text": "What do you do?", "speaker": "narrator", "is_quote": false}]}], "image": {"src": "images/chapter_1_the_fade_friend_turned_1795376550143.jpg", "alt": "Illustration: The Fade — The Friend Being Turned"}, "choices": [{"id": "c1p4_a", "label": {"standard": "Sing the first line of \"Jingle Bells\" as loud as you can, then stop. (Exploit their carol programming!)", "short": "Sing the first line of \"Jingle Bells\" as loud as you can, then stop. (Exploit their carol programming!)"}, "goto": "c1p5a"}, {"id": "c1p4_b", "label": {"standard": "Drop to your knees and scramble under the wooden bleachers. (Use stealth!)", "short": "Drop to your knees and scramble under the wooden bleachers. (Use stealth!)"}, "goto": "c1p5b"}, {"id": "c1p4_c", "label": {"standard": "Shove the giant pyramid of gift boxes onto the floor. (Create a present avalanche!)", "short": "Shove the giant pyramid of gift boxes onto the floor. (Create a present avalanche!)"}, "goto": "c1p5c"}]}, "c1p5a": {"id": "c1p5a", "chapter": 1, "chapter_title": "The Vanishing Season", "title": "The Carol Trap", "paragraphs": [{"raw": "You take a deep breath, puff out your chest, and belt out at the top of your lungs:", "segments": [{"text": "You take a deep breath, puff out your chest, and belt out at the top of your lungs:", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"JINGLE BELLS! JINGLE BELLS! JINGLE ALL THE—\"", "segments": [{"text": "JINGLE BELLS! JINGLE BELLS! JINGLE ALL THE—", "speaker": "narrator", "is_quote": true}]}, {"raw": "You clamp your mouth shut.", "segments": [{"text": "You clamp your mouth shut.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Instantly, all three soldiers freeze mid-step. Their painted wooden jaws drop wide open. Inside their chests, copper gears grind and screech in agony as their internal programming violently collides with the unfinished tune.", "segments": [{"text": "Instantly, all three soldiers freeze mid-step. Their painted wooden jaws drop wide open. Inside their chests, copper gears grind and screech in agony as their internal programming violently collides with the unfinished tune.", "speaker": "narrator", "is_quote": false}]}, {"raw": "WHIRRRR-CLICK-SPUTTER!", "segments": [{"text": "WHIRRRR-CLICK-SPUTTER!", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"CANNOT PERMIT... UNFINISHED CADENCE...\" the commander chokes out.", "segments": [{"text": "CANNOT PERMIT... UNFINISHED CADENCE...", "speaker": "soldier", "is_quote": true}, {"text": "the commander chokes out.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Compelled by ancient holiday magic, the soldiers snap their heels together, raise their arms in stiff choreography, and burst into a deafening, mechanical three-part barbershop harmony:", "segments": [{"text": "Compelled by ancient holiday magic, the soldiers snap their heels together, raise their arms in stiff choreography, and burst into a deafening, mechanical three-part barbershop harmony:", "speaker": "narrator", "is_quote": false}]}, {"raw": "“—WAAAAAY! OH WHAT FUN IT IS TO RIDE IN A ONE-HORSE OPEN SLEIIIIIGH!”", "segments": [{"text": "—WAAAAAY! OH WHAT FUN IT IS TO RIDE IN A ONE-HORSE OPEN SLEIIIIIGH!", "speaker": "narrator", "is_quote": true}]}, {"raw": "While the soldiers are locked in their four-part vibrato, completely powerless to stop singing, you sprint right under their wooden noses, barrel through the emergency doors, and burst out into the freezing alley!", "segments": [{"text": "While the soldiers are locked in their four-part vibrato, completely powerless to stop singing, you sprint right under their wooden noses, barrel through the emergency doors, and burst out into the freezing alley!", "speaker": "narrator", "is_quote": false}]}], "image": {"src": "images/chapter_1_the_fade_friend_turned_1795376550143.jpg", "alt": "Illustration: The Fade — The Friend Being Turned"}, "choices": [{"id": "c1p5a_next", "label": {"standard": "Turn the page", "short": "Turn the page"}, "goto": "c1p6"}]}, "c1p5b": {"id": "c1p5b", "chapter": 1, "chapter_title": "The Vanishing Season", "title": "The Bleacher Shadow", "paragraphs": [{"raw": "You hit the varnished wood floor and slide on your stomach right beneath the bottom row of folded wooden bleachers!", "segments": [{"text": "You hit the varnished wood floor and slide on your stomach right beneath the bottom row of folded wooden bleachers!", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"TARGET HAS VACATED VISUAL FIELD!\" a soldier clicks above you. Heavy wooden boots stomp on the floorboards inches from your fingers. THUD-THUD-THUD!", "segments": [{"text": "TARGET HAS VACATED VISUAL FIELD!", "speaker": "soldier", "is_quote": true}, {"text": "a soldier clicks above you. Heavy wooden boots stomp on the floorboards inches from your fingers. THUD-THUD-THUD!", "speaker": "narrator", "is_quote": false}]}, {"raw": "The space under the bleachers is dark, smelling of dust and lost tennis balls. You keep your head down and scramble on your elbows and knees through the crisscrossing metal support bars. Up above, the soldiers are marching back and forth, knocking over folding chairs in confusion.", "segments": [{"text": "The space under the bleachers is dark, smelling of dust and lost tennis balls. You keep your head down and scramble on your elbows and knees through the crisscrossing metal support bars. Up above, the soldiers are marching back and forth, knocking over folding chairs in confusion.", "speaker": "narrator", "is_quote": false}]}, {"raw": "At the far end of the bleachers, you spot the propped-open equipment room door. You wriggle through a row of red rubber dodgeballs, slide past the ball carts, kick open the back service exit, and dive out into the biting winter air!", "segments": [{"text": "At the far end of the bleachers, you spot the propped-open equipment room door. You wriggle through a row of red rubber dodgeballs, slide past the ball carts, kick open the back service exit, and dive out into the biting winter air!", "speaker": "narrator", "is_quote": false}]}], "image": {"src": "images/chapter_1_the_fade_friend_turned_1795376550143.jpg", "alt": "Illustration: The Fade — The Friend Being Turned"}, "choices": [{"id": "c1p5b_next", "label": {"standard": "Turn the page", "short": "Turn the page"}, "goto": "c1p6"}]}, "c1p5c": {"id": "c1p5c", "chapter": 1, "chapter_title": "The Vanishing Season", "title": "The Present Avalanche", "paragraphs": [{"raw": "You grab the thick velvet ribbon dangling from the bottom of the twenty-foot gift box display and give it everything you've got!", "segments": [{"text": "You grab the thick velvet ribbon dangling from the bottom of the twenty-foot gift box display and give it everything you've got!", "speaker": "narrator", "is_quote": false}]}, {"raw": "RIPPPPP!", "segments": [{"text": "RIPPPPP!", "speaker": "narrator", "is_quote": false}]}, {"raw": "The bottom box slips out, and the entire festive mountain groans.", "segments": [{"text": "The bottom box slips out, and the entire festive mountain groans.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"CRITICAL STRUCTURAL FAILURE!\" the commander rattles, waving his arms.", "segments": [{"text": "CRITICAL STRUCTURAL FAILURE!", "speaker": "soldier", "is_quote": true}, {"text": "the commander rattles, waving his arms.", "speaker": "narrator", "is_quote": false}]}, {"raw": "A shower of colossal, brightly wrapped boxes collapses across the gym like a bright red tidal wave! Giant velvet bows, Styrofoam packing peanuts, and heavy cardboard boxes crash down on the soldiers, sweeping them off their wooden feet.", "segments": [{"text": "A shower of colossal, brightly wrapped boxes collapses across the gym like a bright red tidal wave! Giant velvet bows, Styrofoam packing peanuts, and heavy cardboard boxes crash down on the soldiers, sweeping them off their wooden feet.", "speaker": "narrator", "is_quote": false}]}, {"raw": "The soldiers slide across the polished gym floor like bowling pins, their legs spinning in the air.", "segments": [{"text": "The soldiers slide across the polished gym floor like bowling pins, their legs spinning in the air.", "speaker": "narrator", "is_quote": false}]}, {"raw": "CRASH! BANG! CLATTER!", "segments": [{"text": "CRASH! BANG! CLATTER!", "speaker": "narrator", "is_quote": false}]}, {"raw": "Using the tumbling boxes as stepping stones, you sprint across the floor, smash your shoulder against the emergency push-bar, and burst through the heavy metal doors into the blinding snow!", "segments": [{"text": "Using the tumbling boxes as stepping stones, you sprint across the floor, smash your shoulder against the emergency push-bar, and burst through the heavy metal doors into the blinding snow!", "speaker": "narrator", "is_quote": false}]}], "image": {"src": "images/chapter_1_the_fade_friend_turned_1795376550143.jpg", "alt": "Illustration: The Fade — The Friend Being Turned"}, "choices": [{"id": "c1p5c_next", "label": {"standard": "Turn the page", "short": "Turn the page"}, "goto": "c1p6"}]}, "c1p6": {"id": "c1p6", "chapter": 1, "chapter_title": "The Vanishing Season", "title": "The Snowy Alley", "paragraphs": [{"raw": "The cold air hits your lungs like ice water.", "segments": [{"text": "The cold air hits your lungs like ice water.", "speaker": "narrator", "is_quote": false}]}, {"raw": "You slam the heavy metal emergency door behind you and lean against it, panting. Arizona shouldn't feel like the North Pole, but the wind howling down the alley cuts straight through your jacket.", "segments": [{"text": "You slam the heavy metal emergency door behind you and lean against it, panting. Arizona shouldn't feel like the North Pole, but the wind howling down the alley cuts straight through your jacket.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Behind the metal door, you hear angry wooden fists hammering on the steel:", "segments": [{"text": "Behind the metal door, you hear angry wooden fists hammering on the steel:", "speaker": "narrator", "is_quote": false}]}, {"raw": "BAM! BAM! BAM!", "segments": [{"text": "BAM! BAM! BAM!", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"FESTIVE RESISTER DETECTED! DEPLOYING PURSUIT CONTINGENT!\"", "segments": [{"text": "FESTIVE RESISTER DETECTED! DEPLOYING PURSUIT CONTINGENT!", "speaker": "narrator", "is_quote": true}]}, {"raw": "You look down the alley. Towering brick walls hem you in on both sides. Deep snowdrifts block the path to the street, and green garbage dumpsters are covered in foot-thick mounds of snow. You need somewhere to hide, and fast.", "segments": [{"text": "You look down the alley. Towering brick walls hem you in on both sides. Deep snowdrifts block the path to the street, and green garbage dumpsters are covered in foot-thick mounds of snow. You need somewhere to hide, and fast.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Suddenly, the air in the center of the alley begins to crackle.", "segments": [{"text": "Suddenly, the air in the center of the alley begins to crackle.", "speaker": "narrator", "is_quote": false}]}, {"raw": "It sounds like popping sugar and ticking clock gears. A circle of brilliant, blinding light—glowing warm gold and glacial blue—tears open in the empty air three feet above the ground. Frost crystals spin wildly inside the opening like a miniature hurricane.", "segments": [{"text": "It sounds like popping sugar and ticking clock gears. A circle of brilliant, blinding light—glowing warm gold and glacial blue—tears open in the empty air three feet above the ground. Frost crystals spin wildly inside the opening like a miniature hurricane.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Before you can even blink, something comes tumbling out of the portal.", "segments": [{"text": "Before you can even blink, something comes tumbling out of the portal.", "speaker": "narrator", "is_quote": false}]}, {"raw": "FLUMP!", "segments": [{"text": "FLUMP!", "speaker": "narrator", "is_quote": false}]}, {"raw": "It lands directly upside-down in the biggest snowdrift next to the green dumpster.", "segments": [{"text": "It lands directly upside-down in the biggest snowdrift next to the green dumpster.", "speaker": "narrator", "is_quote": false}]}, {"raw": "The portal snaps shut with a sound like a closing pocket watch.", "segments": [{"text": "The portal snaps shut with a sound like a closing pocket watch.", "speaker": "narrator", "is_quote": false}]}, {"raw": "For three seconds, the alley is dead silent. The only thing moving is a bushy, reddish-orange tail with a snow-covered white tip, sticking straight up out of the snowbank and twitching with great indignation.", "segments": [{"text": "For three seconds, the alley is dead silent. The only thing moving is a bushy, reddish-orange tail with a snow-covered white tip, sticking straight up out of the snowbank and twitching with great indignation.", "speaker": "narrator", "is_quote": false}]}], "image": {"src": "images/chapter_1_the_fade_friend_turned_1795376550143.jpg", "alt": "Illustration: The Fade — The Friend Being Turned"}, "choices": [{"id": "c1p6_next", "label": {"standard": "Turn the page", "short": "Turn the page"}, "goto": "c1p7"}]}, "c1p7": {"id": "c1p7", "chapter": 1, "chapter_title": "The Vanishing Season", "title": "Master Detective Pip", "paragraphs": [{"raw": "With a muffled grunt and a flurry of powdery snow, the figure yanks its head out of the drift.", "segments": [{"text": "With a muffled grunt and a flurry of powdery snow, the figure yanks its head out of the drift.", "speaker": "narrator", "is_quote": false}]}, {"raw": "It’s a fox. A real, living, three-foot-tall fox standing on two hind paws.", "segments": [{"text": "It’s a fox. A real, living, three-foot-tall fox standing on two hind paws.", "speaker": "narrator", "is_quote": false}]}, {"raw": "He wears a heavy green detective's coat that is clearly three sizes too big for him, with brass buttons the size of saucers. A long, hand-knitted red wool scarf is wrapped around his neck so many times his snout barely pokes over the top, and a crooked tweed detective hat rests lopsidedly between two pointed, velvet-brown ears.", "segments": [{"text": "He wears a heavy green detective's coat that is clearly three sizes too big for him, with brass buttons the size of saucers. A long, hand-knitted red wool scarf is wrapped around his neck so many times his snout barely pokes over the top, and a crooked tweed detective hat rests lopsidedly between two pointed, velvet-brown ears.", "speaker": "narrator", "is_quote": false}]}, {"raw": "The fox shakes the snow off his whiskers, vigorously brushes white powder off his coat lapels, and clears his throat with great theatrical flair.", "segments": [{"text": "The fox shakes the snow off his whiskers, vigorously brushes white powder off his coat lapels, and clears his throat with great theatrical flair.", "speaker": "narrator", "is_quote": false}]}, {"raw": "When he speaks, his voice is surprisingly deep, carrying a ridiculously posh, exaggerated British accent:", "segments": [{"text": "When he speaks, his voice is surprisingly deep, carrying a ridiculously posh, exaggerated British accent:", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Ahem! Splendid! An absolutely immaculate piece of trans-dimensional navigation. Father Christmas, I presume, should be standing precisely—\"", "segments": [{"text": "Ahem! Splendid! An absolutely immaculate piece of trans-dimensional navigation. Father Christmas, I presume, should be standing precisely—", "speaker": "narrator", "is_quote": true}]}, {"raw": "The fox pauses. His yellow eyes slowly travel across the brick wall, the icy gravel, and settle directly on the rusted green dumpster three feet from his nose.", "segments": [{"text": "The fox pauses. His yellow eyes slowly travel across the brick wall, the icy gravel, and settle directly on the rusted green dumpster three feet from his nose.", "speaker": "narrator", "is_quote": false}]}, {"raw": "He squints at the graffiti on the dumpster lid.", "segments": [{"text": "He squints at the graffiti on the dumpster lid.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Ah,\" he murmurs, his ears drooping slightly. \"That is... mildly disappointing. The North Pole appears to have significantly deferred its exterior maintenance.\"", "segments": [{"text": "Ah,", "speaker": "narrator", "is_quote": true}, {"text": "he murmurs, his ears drooping slightly.", "speaker": "narrator", "is_quote": false}, {"text": "That is... mildly disappointing. The North Pole appears to have significantly deferred its exterior maintenance.", "speaker": "narrator", "is_quote": true}]}, {"raw": "Down the alleyway, around the corner of the gym, you hear the sharp, rhythmic crunch of wooden boots on frozen snow:", "segments": [{"text": "Down the alleyway, around the corner of the gym, you hear the sharp, rhythmic crunch of wooden boots on frozen snow:", "speaker": "narrator", "is_quote": false}]}, {"raw": "Crunch-clack. Crunch-clack.", "segments": [{"text": "Crunch-clack. Crunch-clack.", "speaker": "narrator", "is_quote": false}]}, {"raw": "The Nutcracker pursuit patrol is coming.", "segments": [{"text": "The Nutcracker pursuit patrol is coming.", "speaker": "narrator", "is_quote": false}]}, {"raw": "What do you do?", "segments": [{"text": "What do you do?", "speaker": "narrator", "is_quote": false}]}], "image": {"src": "images/pip_master_detective_arrives_1795374285923.jpg", "alt": "Illustration: Pip the Master Detective Arrives"}, "choices": [{"id": "c1p7_a", "label": {"standard": "Whisper urgently: \"Hey! Down here, behind the crates! Soldiers are coming!\" (Warn him!)", "short": "Whisper urgently: \"Hey! Down here, behind the crates! Soldiers are coming!\" (Warn him!)"}, "goto": "c1p8a"}, {"id": "c1p7_b", "label": {"standard": "Quietly sneak closer to see what kind of magical device he's holding. (Inspect him!)", "short": "Quietly sneak closer to see what kind of magical device he's holding. (Inspect him!)"}, "goto": "c1p8b"}, {"id": "c1p7_c", "label": {"standard": "Lunge forward, grab his giant scarf, and yank him behind the dumpster! (Take charge!)", "short": "Lunge forward, grab his giant scarf, and yank him behind the dumpster! (Take charge!)"}, "goto": "c1p8c"}]}, "c1p8a": {"id": "c1p8a", "chapter": 1, "chapter_title": "The Vanishing Season", "title": "\"Halt! I'm Armed!\"", "paragraphs": [{"raw": "\"Hey!\" you hiss from the shadows by the brick wall. \"Get down! The wooden soldiers are right around the corner!\"", "segments": [{"text": "Hey!", "speaker": "narrator", "is_quote": true}, {"text": "you hiss from the shadows by the brick wall.", "speaker": "narrator", "is_quote": false}, {"text": "Get down! The wooden soldiers are right around the corner!", "speaker": "narrator", "is_quote": true}]}, {"raw": "The fox jumps three feet straight into the air, his tail poofing out to the size of a water heater!", "segments": [{"text": "The fox jumps three feet straight into the air, his tail poofing out to the size of a water heater!", "speaker": "narrator", "is_quote": false}]}, {"raw": "His fancy British accent vanishes in an instant.", "segments": [{"text": "His fancy British accent vanishes in an instant.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"SWEET MOTHER OF GINGERBREAD, HALT! I'M ARMED! I DON'T KNOW WHAT THIS DOES!\"", "segments": [{"text": "SWEET MOTHER OF GINGERBREAD, HALT! I'M ARMED! I DON'T KNOW WHAT THIS DOES!", "speaker": "narrator", "is_quote": true}]}, {"raw": "He spins around in the snow, wildly swinging a heavy, gleaming brass device in both paws like a club.", "segments": [{"text": "He spins around in the snow, wildly swinging a heavy, gleaming brass device in both paws like a club.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Shh! Be quiet!\" you whisper, lunging forward and waving your hands. \"I'm trying to help you!\"", "segments": [{"text": "Shh! Be quiet!", "speaker": "hero", "is_quote": true}, {"text": "you whisper, lunging forward and waving your hands.", "speaker": "narrator", "is_quote": false}, {"text": "I'm trying to help you!", "speaker": "hero", "is_quote": true}]}, {"raw": "The fox blinks, lowers the brass device slightly, and quickly adjusts his crooked detective cap. He straightens his posture and his ridiculous accent returns as if nothing happened:", "segments": [{"text": "The fox blinks, lowers the brass device slightly, and quickly adjusts his crooked detective cap. He straightens his posture and his ridiculous accent returns as if nothing happened:", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Ahem. Yes. Quite. Naturally, I was merely... testing your tactical reflexes. You passed with acceptable marks, civilian.\"", "segments": [{"text": "Ahem. Yes. Quite. Naturally, I was merely... testing your tactical reflexes. You passed with acceptable marks, civilian.", "speaker": "narrator", "is_quote": true}]}], "image": {"src": "images/pip_master_detective_arrives_1795374285923.jpg", "alt": "Illustration: Pip the Master Detective Arrives"}, "choices": [{"id": "c1p8a_next", "label": {"standard": "Turn the page", "short": "Turn the page"}, "goto": "c1p9"}]}, "c1p8b": {"id": "c1p8b", "chapter": 1, "chapter_title": "The Vanishing Season", "title": "The Clockwork Compass", "paragraphs": [{"raw": "Keeping your boots light on the snow, you creep around the corner of the brick wall to get a better look at what he's holding.", "segments": [{"text": "Keeping your boots light on the snow, you creep around the corner of the brick wall to get a better look at what he's holding.", "speaker": "narrator", "is_quote": false}]}, {"raw": "In his furry paws, the fox is clutching an extraordinary contraption. It looks like a giant, pocket-watch-sized compass forged from polished brass and dark copper. Beneath a spiderweb-cracked crystal face, half a dozen tiny silver needles are spinning erratically in opposite directions. Tiny glass vials of glowing blue sand bubble on the sides, and interlocking gears click softly: tick-tick-tick-whirr.", "segments": [{"text": "In his furry paws, the fox is clutching an extraordinary contraption. It looks like a giant, pocket-watch-sized compass forged from polished brass and dark copper. Beneath a spiderweb-cracked crystal face, half a dozen tiny silver needles are spinning erratically in opposite directions. Tiny glass vials of glowing blue sand bubble on the sides, and interlocking gears click softly: tick-tick-tick-whirr.", "speaker": "narrator", "is_quote": false}]}, {"raw": "As you lean in closer, your shadow falls across him.", "segments": [{"text": "As you lean in closer, your shadow falls across him.", "speaker": "narrator", "is_quote": false}]}, {"raw": "The fox's ears shoot up. He wheels around, dropping his accent completely:", "segments": [{"text": "The fox's ears shoot up. He wheels around, dropping his accent completely:", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"YAAAAAH! BACK OFF! I'LL PRESS THE BUTTON! I SWEAR TO ST. NICK I'LL PRESS IT!\"", "segments": [{"text": "YAAAAAH! BACK OFF! I'LL PRESS THE BUTTON! I SWEAR TO ST. NICK I'LL PRESS IT!", "speaker": "narrator", "is_quote": true}]}, {"raw": "\"Wait, don't yell!\" you whisper, holding up your hands. \"I'm running from the Nutcrackers!\"", "segments": [{"text": "Wait, don't yell!", "speaker": "hero", "is_quote": true}, {"text": "you whisper, holding up your hands.", "speaker": "narrator", "is_quote": false}, {"text": "I'm running from the Nutcrackers!", "speaker": "hero", "is_quote": true}]}, {"raw": "The fox halts, eyeing your winter jacket suspiciously. He clears his throat, tucks the device under his arm, and pulls on his lapels.", "segments": [{"text": "The fox halts, eyeing your winter jacket suspiciously. He clears his throat, tucks the device under his arm, and pulls on his lapels.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Ahem. Of course. A fellow fugitive from justice. I deduced that instantly from the aerodynamic angle of your shoelaces.\"", "segments": [{"text": "Ahem. Of course. A fellow fugitive from justice. I deduced that instantly from the aerodynamic angle of your shoelaces.", "speaker": "narrator", "is_quote": true}]}], "image": {"src": "images/pip_master_detective_arrives_1795374285923.jpg", "alt": "Illustration: Pip the Master Detective Arrives"}, "choices": [{"id": "c1p8b_next", "label": {"standard": "Turn the page", "short": "Turn the page"}, "goto": "c1p9"}]}, "c1p8c": {"id": "c1p8c", "chapter": 1, "chapter_title": "The Vanishing Season", "title": "The Dumpster Dive", "paragraphs": [{"raw": "There’s no time to explain. The beam of a Nutcracker's brass lantern is already sweeping across the brick wall fifty feet away.", "segments": [{"text": "There’s no time to explain. The beam of a Nutcracker's brass lantern is already sweeping across the brick wall fifty feet away.", "speaker": "narrator", "is_quote": false}]}, {"raw": "You sprint forward, grab the trailing tail of the fox's long red scarf, and give it a firm yank!", "segments": [{"text": "You sprint forward, grab the trailing tail of the fox's long red scarf, and give it a firm yank!", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"I SAY! UNHAND THE MERCHANDISE—OOF!\"", "segments": [{"text": "I SAY! UNHAND THE MERCHANDISE—OOF!", "speaker": "narrator", "is_quote": true}]}, {"raw": "You pull the fox sideways behind the wide green dumpster just as the lantern beam cuts through the snow where he was standing!", "segments": [{"text": "You pull the fox sideways behind the wide green dumpster just as the lantern beam cuts through the snow where he was standing!", "speaker": "narrator", "is_quote": false}]}, {"raw": "The fox lands on your boots, his cap knocked down over his eyes. For a second, he panics in pure, unscripted terror:", "segments": [{"text": "The fox lands on your boots, his cap knocked down over his eyes. For a second, he panics in pure, unscripted terror:", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"I DON'T TASTE GOOD! I'M MOSTLY FLUFF AND BAD ATTITUDE!\"", "segments": [{"text": "I DON'T TASTE GOOD! I'M MOSTLY FLUFF AND BAD ATTITUDE!", "speaker": "narrator", "is_quote": true}]}, {"raw": "\"Quiet!\" you whisper into his furry ear, pointing toward the mouth of the alley. \"Look.\"", "segments": [{"text": "Quiet!", "speaker": "hero", "is_quote": true}, {"text": "you whisper into his furry ear, pointing toward the mouth of the alley.", "speaker": "narrator", "is_quote": false}, {"text": "Look.", "speaker": "hero", "is_quote": true}]}, {"raw": "Peering through the gap between the dumpster and the wall, the fox watches as four stiff-legged Nutcrackers march past, their brass bayonets gleaming in the snow.", "segments": [{"text": "Peering through the gap between the dumpster and the wall, the fox watches as four stiff-legged Nutcrackers march past, their brass bayonets gleaming in the snow.", "speaker": "narrator", "is_quote": false}]}, {"raw": "The fox pushes his hat out of his eyes. He looks at you, looks at the soldiers, and nods with dignified gravity:", "segments": [{"text": "The fox pushes his hat out of his eyes. He looks at you, looks at the soldiers, and nods with dignified gravity:", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Ahem. An adequate flanking maneuver. I allowed you to execute it to bolster your youthful self-esteem. You may thank me later.\"", "segments": [{"text": "Ahem. An adequate flanking maneuver. I allowed you to execute it to bolster your youthful self-esteem. You may thank me later.", "speaker": "narrator", "is_quote": true}]}], "image": {"src": "images/pip_master_detective_arrives_1795374285923.jpg", "alt": "Illustration: Pip the Master Detective Arrives"}, "choices": [{"id": "c1p8c_next", "label": {"standard": "Turn the page", "short": "Turn the page"}, "goto": "c1p9"}]}, "c1p9": {"id": "c1p9", "chapter": 1, "chapter_title": "The Vanishing Season", "title": "The Panic Button", "paragraphs": [{"raw": "\"SUSPICIOUS SCARF RESIDUE IDENTIFIED,\" a metallic voice clicks from the snow.", "segments": [{"text": "SUSPICIOUS SCARF RESIDUE IDENTIFIED,", "speaker": "narrator", "is_quote": true}, {"text": "a metallic voice clicks from the snow.", "speaker": "narrator", "is_quote": false}]}, {"raw": "You and the fox freeze.", "segments": [{"text": "You and the fox freeze.", "speaker": "narrator", "is_quote": false}]}, {"raw": "One of the Nutcracker soldiers has stopped right in front of the dumpster. Its wooden head slowly rotates a full one-hundred-and-eighty degrees backward, until its unblinking black eyes lock directly onto you and the fox.", "segments": [{"text": "One of the Nutcracker soldiers has stopped right in front of the dumpster. Its wooden head slowly rotates a full one-hundred-and-eighty degrees backward, until its unblinking black eyes lock directly onto you and the fox.", "speaker": "narrator", "is_quote": false}]}, {"raw": "CLACK-CLACK.", "segments": [{"text": "CLACK-CLACK.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"UNAUTHORIZED CANINE DETECTED,\" the soldier rattles. \"UNRECONSTRUCTED YOUTH DETECTED. SURRENDER FOR IMMEDIATE FESTIVE INTEGRATION.\"", "segments": [{"text": "UNAUTHORIZED CANINE DETECTED,", "speaker": "soldier", "is_quote": true}, {"text": "the soldier rattles.", "speaker": "narrator", "is_quote": false}, {"text": "UNRECONSTRUCTED YOUTH DETECTED. SURRENDER FOR IMMEDIATE FESTIVE INTEGRATION.", "speaker": "soldier", "is_quote": true}]}, {"raw": "\"Festive integration?!\" the fox gasps, his fur standing straight on end. \"I'll have you know I am already exceedingly festive! I once wore mistletoe in my tail for three consecutive fortnights!\"", "segments": [{"text": "Festive integration?!", "speaker": "pip", "is_quote": true}, {"text": "the fox gasps, his fur standing straight on end.", "speaker": "narrator", "is_quote": false}, {"text": "I'll have you know I am already exceedingly festive! I once wore mistletoe in my tail for three consecutive fortnights!", "speaker": "pip", "is_quote": true}]}, {"raw": "Five more soldiers round the corner, raising wooden staffs that hum with crackling violet electricity. They box you into the brick wall. There's nowhere left to run.", "segments": [{"text": "Five more soldiers round the corner, raising wooden staffs that hum with crackling violet electricity. They box you into the brick wall. There's nowhere left to run.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Alright, clever guy,\" you say, looking down at the fox. \"You're a detective? What's the plan?\"", "segments": [{"text": "Alright, clever guy,", "speaker": "pip", "is_quote": true}, {"text": "you say, looking down at the fox.", "speaker": "narrator", "is_quote": false}, {"text": "You're a detective? What's the plan?", "speaker": "pip", "is_quote": true}]}, {"raw": "\"The plan?\" The fox laughs, a high-pitched, nervous sound that squeaks like a rusty hinge. \"The plan is elementary! We employ the ancient art of... OH GINGER-SNAPS, WE'RE GOING TO BE FIREWOOD!\"", "segments": [{"text": "The plan?", "speaker": "pip", "is_quote": true}, {"text": "The fox laughs, a high-pitched, nervous sound that squeaks like a rusty hinge.", "speaker": "narrator", "is_quote": false}, {"text": "The plan is elementary! We employ the ancient art of... OH GINGER-SNAPS, WE'RE GOING TO BE FIREWOOD!", "speaker": "pip", "is_quote": true}]}, {"raw": "His British accent is completely gone now.", "segments": [{"text": "His British accent is completely gone now.", "speaker": "narrator", "is_quote": false}]}, {"raw": "He frantically grabs the brass compass, violently shaking it like an old ketchup bottle.", "segments": [{"text": "He frantically grabs the brass compass, violently shaking it like an old ketchup bottle.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Work, you blasted pile of clockwork! Work!\"", "segments": [{"text": "Work, you blasted pile of clockwork! Work!", "speaker": "narrator", "is_quote": true}]}, {"raw": "\"What does it do?!\" you shout as the soldiers close in, their painted teeth grinning.", "segments": [{"text": "What does it do?!", "speaker": "soldier", "is_quote": true}, {"text": "you shout as the soldiers close in, their painted teeth grinning.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"I DON'T KNOW! I FOUND IT IN THE CLOCK TOWER!\"", "segments": [{"text": "I DON'T KNOW! I FOUND IT IN THE CLOCK TOWER!", "speaker": "narrator", "is_quote": true}]}, {"raw": "The fox raises his furry paw and slams his palm down onto the large copper plunger on top of the compass!", "segments": [{"text": "The fox raises his furry paw and slams his palm down onto the large copper plunger on top of the compass!", "speaker": "narrator", "is_quote": false}]}, {"raw": "CLIIIIICK-WHIRRRRRR!", "segments": [{"text": "CLIIIIICK-WHIRRRRRR!", "speaker": "narrator", "is_quote": false}]}, {"raw": "Inside the brass casing, the spinning gears scream. The spiderweb cracks on the glass face erupt with blinding, glacial-blue light!", "segments": [{"text": "Inside the brass casing, the spinning gears scream. The spiderweb cracks on the glass face erupt with blinding, glacial-blue light!", "speaker": "narrator", "is_quote": false}]}, {"raw": "A freezing shockwave of wind explodes through the alley, blowing the soldiers' fuzzy hats straight off their wooden heads!", "segments": [{"text": "A freezing shockwave of wind explodes through the alley, blowing the soldiers' fuzzy hats straight off their wooden heads!", "speaker": "narrator", "is_quote": false}]}, {"raw": "The brick walls seem to bend like rubber. The snowy ground drops out from beneath your boots. Before you can scream, the blue light twists into a roaring vortex of frost, gears, and temporal lightning—swallowing you and the fox whole!", "segments": [{"text": "The brick walls seem to bend like rubber. The snowy ground drops out from beneath your boots. Before you can scream, the blue light twists into a roaring vortex of frost, gears, and temporal lightning—swallowing you and the fox whole!", "speaker": "narrator", "is_quote": false}]}], "image": {"src": "images/pip_master_detective_arrives_1795374285923.jpg", "alt": "Illustration: Pip the Master Detective Arrives"}, "choices": [{"id": "c1p9_next", "label": {"standard": "Turn the page", "short": "Turn the page"}, "goto": "c1p10"}]}, "c1p10": {"id": "c1p10", "chapter": 1, "chapter_title": "The Vanishing Season", "title": "Everfrost", "paragraphs": [{"raw": "WHHOOOOOOOOOOSH!", "segments": [{"text": "WHHOOOOOOOOOOSH!", "speaker": "narrator", "is_quote": false}]}, {"raw": "You crash into something soft, cold, and utterly blinding.", "segments": [{"text": "You crash into something soft, cold, and utterly blinding.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Snow. Tons and tons of freezing, powdery, delicious-smelling snow.", "segments": [{"text": "Snow. Tons and tons of freezing, powdery, delicious-smelling snow.", "speaker": "narrator", "is_quote": false}]}, {"raw": "You roll over, sputtering and coughing, shaking white flakes out of your eyelashes. The biting Arizona wind is gone. The smell of asphalt and garbage dumpsters is gone. Instead, the air smells crisp and magical—like fresh pine needles, woodsmoke, peppermint, and melted chocolate.", "segments": [{"text": "You roll over, sputtering and coughing, shaking white flakes out of your eyelashes. The biting Arizona wind is gone. The smell of asphalt and garbage dumpsters is gone. Instead, the air smells crisp and magical—like fresh pine needles, woodsmoke, peppermint, and melted chocolate.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Next to you in the drift, the brass compass gives a tired little pfffft sound, and a sad wisp of black smoke curls out from its gears.", "segments": [{"text": "Next to you in the drift, the brass compass gives a tired little pfffft sound, and a sad wisp of black smoke curls out from its gears.", "speaker": "narrator", "is_quote": false}]}, {"raw": "A pair of pointed ears pops out of the snow, followed by a tweed hat.", "segments": [{"text": "A pair of pointed ears pops out of the snow, followed by a tweed hat.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Pip sits up, rubs his sore nose, and adjusts his coat with trembling paws. He glances at the broken, smoking compass, quickly stuffs it behind his back, and clears his throat:", "segments": [{"text": "Pip sits up, rubs his sore nose, and adjusts his coat with trembling paws. He glances at the broken, smoking compass, quickly stuffs it behind his back, and clears his throat:", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Ahem. And thus concludes our rapid tactical repositioning. Text-book execution. Nothing to it.\"", "segments": [{"text": "Ahem. And thus concludes our rapid tactical repositioning. Text-book execution. Nothing to it.", "speaker": "narrator", "is_quote": true}]}, {"raw": "He turns to look at you, his eyes darting around nervously.", "segments": [{"text": "He turns to look at you, his eyes darting around nervously.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"You wouldn't, by any remote stretch of the imagination... happen to know how to repair an eighth-century chronometric flux-spring, would you?\"", "segments": [{"text": "You wouldn't, by any remote stretch of the imagination... happen to know how to repair an eighth-century chronometric flux-spring, would you?", "speaker": "narrator", "is_quote": true}]}, {"raw": "\"No,\" you say, brushing snow off your knees. \"Where are we?\"", "segments": [{"text": "No,", "speaker": "hero", "is_quote": true}, {"text": "you say, brushing snow off your knees.", "speaker": "narrator", "is_quote": false}, {"text": "Where are we?", "speaker": "hero", "is_quote": true}]}, {"raw": "Pip doesn't answer right away. He slowly turns around, looking down the ridge.", "segments": [{"text": "Pip doesn't answer right away. He slowly turns around, looking down the ridge.", "speaker": "narrator", "is_quote": false}]}, {"raw": "You follow his gaze—and your breath catches in your throat.", "segments": [{"text": "You follow his gaze—and your breath catches in your throat.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Spread across the valley below is the most extraordinary village you have ever seen.", "segments": [{"text": "Spread across the valley below is the most extraordinary village you have ever seen.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Hundreds of gingerbread-trimmed cottages nestle against the snowy mountainside, their frosted windows glowing with warm, welcoming amber light. Frozen waterways of glittering ice wind under carved stone bridges, and hot-air balloons decorated like holiday ornaments drift lazily between mountain peaks.", "segments": [{"text": "Hundreds of gingerbread-trimmed cottages nestle against the snowy mountainside, their frosted windows glowing with warm, welcoming amber light. Frozen waterways of glittering ice wind under carved stone bridges, and hot-air balloons decorated like holiday ornaments drift lazily between mountain peaks.", "speaker": "narrator", "is_quote": false}]}, {"raw": "And rising high above the center of the village, towering into the starry sky, is the Grand Clock.", "segments": [{"text": "And rising high above the center of the village, towering into the starry sky, is the Grand Clock.", "speaker": "narrator", "is_quote": false}]}, {"raw": "It is an immense, breathtaking mountain of brass, crystal, and glowing clockwork. Towering gear wheels five stories high turn in silent, majestic harmony, bathing the entire valley in a soft, golden radiance.", "segments": [{"text": "It is an immense, breathtaking mountain of brass, crystal, and glowing clockwork. Towering gear wheels five stories high turn in silent, majestic harmony, bathing the entire valley in a soft, golden radiance.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Welcome,\" Pip whispers, his voice quiet and uncharacteristically solemn. \"To Everfrost.\"", "segments": [{"text": "Welcome,", "speaker": "pip", "is_quote": true}, {"text": "Pip whispers, his voice quiet and uncharacteristically solemn.", "speaker": "narrator", "is_quote": false}, {"text": "To Everfrost.", "speaker": "pip", "is_quote": true}]}, {"raw": "You stare down at the glowing spires. \"Everfrost? What is this place?\"", "segments": [{"text": "You stare down at the glowing spires.", "speaker": "narrator", "is_quote": false}, {"text": "Everfrost? What is this place?", "speaker": "narrator", "is_quote": true}]}, {"raw": "\"It's where Christmas comes from,\" Pip says, clutching his coat tighter around his chest. \"Or rather... where it is supposed to be kept safe.\"", "segments": [{"text": "It's where Christmas comes from,", "speaker": "pip", "is_quote": true}, {"text": "Pip says, clutching his coat tighter around his chest.", "speaker": "narrator", "is_quote": false}, {"text": "Or rather... where it is supposed to be kept safe.", "speaker": "pip", "is_quote": true}]}, {"raw": "Suddenly, the golden glow from the giant clock flickers.", "segments": [{"text": "Suddenly, the golden glow from the giant clock flickers.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Deep inside the clockwork spires, something groans. A metallic shriek echoes across the valley, so loud it sends snow avalanching down the distant peaks.", "segments": [{"text": "Deep inside the clockwork spires, something groans. A metallic shriek echoes across the valley, so loud it sends snow avalanching down the distant peaks.", "speaker": "narrator", "is_quote": false}]}, {"raw": "The massive, golden hour hand on the Grand Clock violently shudders.", "segments": [{"text": "The massive, golden hour hand on the Grand Clock violently shudders.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Instead of moving forward... it jerks backward.", "segments": [{"text": "Instead of moving forward... it jerks backward.", "speaker": "narrator", "is_quote": false}]}, {"raw": "BONGGGGGGG.", "segments": [{"text": "BONGGGGGGG.", "speaker": "narrator", "is_quote": false}]}, {"raw": "A deep, unnatural bell tolls across the village.", "segments": [{"text": "A deep, unnatural bell tolls across the village.", "speaker": "narrator", "is_quote": false}]}, {"raw": "BONG. BONG. BONG.", "segments": [{"text": "BONG. BONG. BONG.", "speaker": "narrator", "is_quote": false}]}, {"raw": "You count the strikes in your head. Nine... ten... eleven... twelve...", "segments": [{"text": "You count the strikes in your head. Nine... ten... eleven... twelve...", "speaker": "narrator", "is_quote": false}]}, {"raw": "BONG.", "segments": [{"text": "BONG.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Thirteen.", "segments": [{"text": "Thirteen.", "speaker": "narrator", "is_quote": false}]}, {"raw": "A cold, violet wave of magical energy ripples outward from the clock tower, sweeping across the village roofs. In an instant, every warm amber window in Everfrost blinks out into darkness.", "segments": [{"text": "A cold, violet wave of magical energy ripples outward from the clock tower, sweeping across the village roofs. In an instant, every warm amber window in Everfrost blinks out into darkness.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Pip’s bushy tail drops between his legs. His eyes go wide with genuine horror.", "segments": [{"text": "Pip’s bushy tail drops between his legs. His eyes go wide with genuine horror.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Pip?\" you whisper, the hair on the back of your neck standing up. \"What was that?\"", "segments": [{"text": "Pip?", "speaker": "hero", "is_quote": true}, {"text": "you whisper, the hair on the back of your neck standing up.", "speaker": "narrator", "is_quote": false}, {"text": "What was that?", "speaker": "hero", "is_quote": true}]}, {"raw": "Pip slowly swallows. His exaggerated detective accent is completely gone.", "segments": [{"text": "Pip slowly swallows. His exaggerated detective accent is completely gone.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"That...\" Pip whispers into the freezing dark, \"...wasn't supposed to happen until tomorrow.\"", "segments": [{"text": "That...", "speaker": "pip", "is_quote": true}, {"text": "Pip whispers into the freezing dark,", "speaker": "narrator", "is_quote": false}, {"text": "...wasn't supposed to happen until tomorrow.", "speaker": "pip", "is_quote": true}]}], "image": {"src": "images/everfrost_grand_clock_reveal_1795376837130.jpg", "alt": "Illustration: The Reveal of Everfrost & The Grand Clock"}, "choices": [{"id": "c1p10_next", "label": {"standard": "Turn the page", "short": "Turn the page"}, "goto": "c2p1"}]}, "c2p1": {"id": "c2p1", "chapter": 2, "chapter_title": "The Whispering Pines & The Clockmaker's Vault", "title": "The Forest of Lost Summers", "paragraphs": [{"raw": "The wind howling across the high ridge was so cold it made your teeth ache.", "segments": [{"text": "The wind howling across the high ridge was so cold it made your teeth ache.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Down in the valley, Everfrost lay in pitch-black shadow. The Grand Clock's giant golden face was completely dark, but its massive brass pendulum still swung with a heavy, hollow CLANG-CLANG that rattled the snow right off the pine branches.", "segments": [{"text": "Down in the valley, Everfrost lay in pitch-black shadow. The Grand Clock's giant golden face was completely dark, but its massive brass pendulum still swung with a heavy, hollow CLANG-CLANG that rattled the snow right off the pine branches.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Right then,\" Pip muttered, pulling his crooked detective hat down over his pointed ears. \"The situation has officially escalated from 'moderately troublesome' to 'thoroughly catastrophic.' We must make for my headquarters at once.\"", "segments": [{"text": "Right then,", "speaker": "pip", "is_quote": true}, {"text": "Pip muttered, pulling his crooked detective hat down over his pointed ears.", "speaker": "narrator", "is_quote": false}, {"text": "The situation has officially escalated from 'moderately troublesome' to 'thoroughly catastrophic.' We must make for my headquarters at once.", "speaker": "pip", "is_quote": true}]}, {"raw": "\"Your headquarters?\" you ask, rubbing your freezing arms. \"Where is that?\"", "segments": [{"text": "Your headquarters?", "speaker": "hero", "is_quote": true}, {"text": "you ask, rubbing your freezing arms.", "speaker": "narrator", "is_quote": false}, {"text": "Where is that?", "speaker": "hero", "is_quote": true}]}, {"raw": "\"A classified location of immense strategic importance,\" Pip declared, puffing out his chest under his giant green coat. \"The locals call it the Old Abandoned Mill by the frozen river. I call it... The Foxhole of Justice.\"", "segments": [{"text": "A classified location of immense strategic importance,", "speaker": "pip", "is_quote": true}, {"text": "Pip declared, puffing out his chest under his giant green coat.", "speaker": "narrator", "is_quote": false}, {"text": "The locals call it the Old Abandoned Mill by the frozen river. I call it... The Foxhole of Justice.", "speaker": "pip", "is_quote": true}]}, {"raw": "He turned and trotted into the dense pine forest lining the mountain slope. You hurry after him, your boots crunching through the deep, powdery snow.", "segments": [{"text": "He turned and trotted into the dense pine forest lining the mountain slope. You hurry after him, your boots crunching through the deep, powdery snow.", "speaker": "narrator", "is_quote": false}]}, {"raw": "The deeper you go into the woods, the stranger it gets.", "segments": [{"text": "The deeper you go into the woods, the stranger it gets.", "speaker": "narrator", "is_quote": false}]}, {"raw": "The wind isn't just whistling through the frosted needles—it’s talking.", "segments": [{"text": "The wind isn't just whistling through the frosted needles—it’s talking.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Faint, overlapping whispers drift off the snowbanks like silver mist. If you listen closely, they aren't words about winter or snow at all.", "segments": [{"text": "Faint, overlapping whispers drift off the snowbanks like silver mist. If you listen closely, they aren't words about winter or snow at all.", "speaker": "narrator", "is_quote": false}]}, {"raw": "“...don't forget the sunscreen at the pool...”", "segments": [{"text": "...don't forget the sunscreen at the pool...", "speaker": "narrator", "is_quote": true}]}, {"raw": "“...look at the red and gold leaves on the maple tree...”", "segments": [{"text": "...look at the red and gold leaves on the maple tree...", "speaker": "narrator", "is_quote": true}]}, {"raw": "“...make a wish and blow out all eight candles...”", "segments": [{"text": "...make a wish and blow out all eight candles...", "speaker": "narrator", "is_quote": true}]}, {"raw": "“...fourth of July fireworks start at nine...”", "segments": [{"text": "...fourth of July fireworks start at nine...", "speaker": "narrator", "is_quote": true}]}, {"raw": "You stop in your tracks. \"Pip... do you hear that?\"", "segments": [{"text": "You stop in your tracks.", "speaker": "narrator", "is_quote": false}, {"text": "Pip... do you hear that?", "speaker": "narrator", "is_quote": true}]}, {"raw": "\"Hear what?\" Pip asked, stopping and adjusting his scarf. \"The ominous whistling of the arctic gusts? The subtle rustle of nocturnal woodland creatures? The roar of my own deductive intellect?\"", "segments": [{"text": "Hear what?", "speaker": "pip", "is_quote": true}, {"text": "Pip asked, stopping and adjusting his scarf.", "speaker": "narrator", "is_quote": false}, {"text": "The ominous whistling of the arctic gusts? The subtle rustle of nocturnal woodland creatures? The roar of my own deductive intellect?", "speaker": "pip", "is_quote": true}]}, {"raw": "\"No,\" you say, crouching beside a glowing blue snowdrift. \"Listen. It's summer. It's birthdays. It's autumn. The snow is whispering memories!\"", "segments": [{"text": "No,", "speaker": "hero", "is_quote": true}, {"text": "you say, crouching beside a glowing blue snowdrift.", "speaker": "narrator", "is_quote": false}, {"text": "Listen. It's summer. It's birthdays. It's autumn. The snow is whispering memories!", "speaker": "hero", "is_quote": true}]}], "image": {"src": "images/whispering_pines_first_person_1795379843042.jpg", "alt": "Illustration: The Whispering Pines (First-Person POV)"}, "choices": [{"id": "c2p1_next", "label": {"standard": "Turn the page", "short": "Turn the page"}, "goto": "c2p2"}]}, "c2p2": {"id": "c2p2", "chapter": 2, "chapter_title": "The Whispering Pines & The Clockmaker's Vault", "title": "The Clue in the Snow", "paragraphs": [{"raw": "Pip’s ears twitched forward. He dropped to all four paws, crawled over to the drift, and pressed his fuzzy ear directly into the snow.", "segments": [{"text": "Pip’s ears twitched forward. He dropped to all four paws, crawled over to the drift, and pressed his fuzzy ear directly into the snow.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Good heavens,\" he whispered, his eyes widening. \"You're right. It's the stolen time. The Clockmaker’s machinery isn't just dumping Christmas magic into your world—it's vacuuming up everything else and burying it in the snow!\"", "segments": [{"text": "Good heavens,", "speaker": "narrator", "is_quote": true}, {"text": "he whispered, his eyes widening.", "speaker": "narrator", "is_quote": false}, {"text": "You're right. It's the stolen time. The Clockmaker’s machinery isn't just dumping Christmas magic into your world—it's vacuuming up everything else and burying it in the snow!", "speaker": "narrator", "is_quote": true}]}, {"raw": "Underneath the jumble of summer picnics and birthday parties, you hear a rhythmic, metallic whisper ticking in time with the distant Grand Clock:", "segments": [{"text": "Underneath the jumble of summer picnics and birthday parties, you hear a rhythmic, metallic whisper ticking in time with the distant Grand Clock:", "speaker": "narrator", "is_quote": false}]}, {"raw": "Tick... tick... tick...", "segments": [{"text": "Tick... tick... tick...", "speaker": "narrator", "is_quote": false}]}, {"raw": "“When the thirteenth bell sighs... the cog turns where the cold river lies.”", "segments": [{"text": "When the thirteenth bell sighs... the cog turns where the cold river lies.", "speaker": "narrator", "is_quote": true}]}, {"raw": "\"Wait,\" you say, looking up. \"Did you hear that part? When the thirteenth bell sighs, the cog turns where the cold river lies!\"", "segments": [{"text": "Wait,", "speaker": "hero", "is_quote": true}, {"text": "you say, looking up.", "speaker": "narrator", "is_quote": false}, {"text": "Did you hear that part? When the thirteenth bell sighs, the cog turns where the cold river lies!", "speaker": "hero", "is_quote": true}]}, {"raw": "Pip froze. He slowly stood up on his hind legs, dusted off his knees, and pulled a tattered little notebook and pencil stub from his coat pocket.", "segments": [{"text": "Pip froze. He slowly stood up on his hind legs, dusted off his knees, and pulled a tattered little notebook and pencil stub from his coat pocket.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Aha!\" Pip gasped, his accent slipping into genuine frustration. \"That blasted phrase again! I’ve been hearing that infernal riddle for three weeks! I searched Santa’s deep-freeze ice cellar—nothing but frozen eggnog! I searched the Glacier Caves—nothing but grumpy polar bears!\"", "segments": [{"text": "Aha!", "speaker": "pip", "is_quote": true}, {"text": "Pip gasped, his accent slipping into genuine frustration.", "speaker": "narrator", "is_quote": false}, {"text": "That blasted phrase again! I’ve been hearing that infernal riddle for three weeks! I searched Santa’s deep-freeze ice cellar—nothing but frozen eggnog! I searched the Glacier Caves—nothing but grumpy polar bears!", "speaker": "pip", "is_quote": true}]}, {"raw": "Pip threw his little paws in the air. \"What in St. Nick's beard does 'where the cold river lies' mean?!\"", "segments": [{"text": "Pip threw his little paws in the air.", "speaker": "narrator", "is_quote": false}, {"text": "What in St. Nick's beard does 'where the cold river lies' mean?!", "speaker": "pip", "is_quote": true}]}, {"raw": "What do you tell Pip this clue means?", "segments": [{"text": "What do you tell Pip this clue means?", "speaker": "narrator", "is_quote": false}]}], "image": {"src": "images/whispering_pines_first_person_1795379843042.jpg", "alt": "Illustration: The Whispering Pines (First-Person POV)"}, "choices": [{"id": "c2p2_a", "label": {"standard": "\"Maybe it means Santa's deep freeze ice cellar after all?\"", "short": "\"Maybe it means Santa's deep freeze ice cellar after all?\""}, "goto": "c2p2resolution"}, {"id": "c2p2_b", "label": {"standard": "\"Could it be the Glacier Caves at the top of the mountain?\"", "short": "\"Could it be the Glacier Caves at the top of the mountain?\""}, "goto": "c2p2resolution"}, {"id": "c2p2_c", "label": {"standard": "\"Pip! Your old mill is right down by the frozen river! The secret cog is in your mill!\"", "short": "\"Pip! Your old mill is right down by the frozen river! The secret cog is in your mill!\""}, "goto": "c2p2resolution"}]}, "c2p2resolution": {"id": "c2p2resolution", "chapter": 2, "chapter_title": "The Whispering Pines & The Clockmaker's Vault", "title": "The Deduction", "paragraphs": [{"raw": "You look at the frosty trees, then remember what Pip told you just two minutes ago.", "segments": [{"text": "You look at the frosty trees, then remember what Pip told you just two minutes ago.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Pip,\" you say, pointing down the mountain toward the dark valley. \"You said your headquarters is at the old mill... by the frozen river.\"", "segments": [{"text": "Pip,", "speaker": "hero", "is_quote": true}, {"text": "you say, pointing down the mountain toward the dark valley.", "speaker": "narrator", "is_quote": false}, {"text": "You said your headquarters is at the old mill... by the frozen river.", "speaker": "hero", "is_quote": true}]}, {"raw": "Pip blinked. \"Yes. The Old River Mill.\"", "segments": [{"text": "Pip blinked.", "speaker": "narrator", "is_quote": false}, {"text": "Yes. The Old River Mill.", "speaker": "pip", "is_quote": true}]}, {"raw": "\"And a mill is run by waterwheels and giant cogs,\" you say. \"The riddle says the cog turns where the cold river lies. The secret cog isn't at the North Pole. It's hidden inside your mill!\"", "segments": [{"text": "And a mill is run by waterwheels and giant cogs,", "speaker": "hero", "is_quote": true}, {"text": "you say.", "speaker": "narrator", "is_quote": false}, {"text": "The riddle says the cog turns where the cold river lies. The secret cog isn't at the North Pole. It's hidden inside your mill!", "speaker": "hero", "is_quote": true}]}, {"raw": "For five seconds, Pip stared at you with his mouth open. His whiskers twitched.", "segments": [{"text": "For five seconds, Pip stared at you with his mouth open. His whiskers twitched.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Then, his eyes narrowed, he snapped his little notebook shut with a loud SLAP, and cleared his throat with supreme dignity:", "segments": [{"text": "Then, his eyes narrowed, he snapped his little notebook shut with a loud SLAP, and cleared his throat with supreme dignity:", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Ahem! Splendid! I wondered when you would finally catch up!\"", "segments": [{"text": "Ahem! Splendid! I wondered when you would finally catch up!", "speaker": "narrator", "is_quote": true}]}, {"raw": "\"Wait—you knew?!\" you ask.", "segments": [{"text": "Wait—you knew?!", "speaker": "hero", "is_quote": true}, {"text": "you ask.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Naturally!\" Pip said breezily, waving a paw in the air. \"An open-and-shut deduction! I was merely withholding the solution to allow your youthful, developing mind to stretch its investigative legs. Consider it a masterclass in field training. You're welcome.\"", "segments": [{"text": "Naturally!", "speaker": "pip", "is_quote": true}, {"text": "Pip said breezily, waving a paw in the air.", "speaker": "narrator", "is_quote": false}, {"text": "An open-and-shut deduction! I was merely withholding the solution to allow your youthful, developing mind to stretch its investigative legs. Consider it a masterclass in field training. You're welcome.", "speaker": "pip", "is_quote": true}]}], "image": {"src": "images/whispering_pines_first_person_1795379843042.jpg", "alt": "Illustration: The Whispering Pines (First-Person POV)"}, "choices": [{"id": "c2p2resolution_next", "label": {"standard": "Turn the page", "short": "Turn the page"}, "goto": "c2p3"}]}, "c2p3": {"id": "c2p3", "chapter": 2, "chapter_title": "The Whispering Pines & The Clockmaker's Vault", "title": "The Frozen Aqueduct", "paragraphs": [{"raw": "Leaving the whispering forest behind, Pip led you out onto a high stone ridge overlooking the valley.", "segments": [{"text": "Leaving the whispering forest behind, Pip led you out onto a high stone ridge overlooking the valley.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Stretching across the canyon like the spine of a sleeping dragon was the Ancient Aqueduct—a massive, arched bridg
