o doubt. A trick of the mind! Very well, I shall put your confectionery claim to the test!", "speaker": "pip", "is_quote": true}]}, {"raw": "Pip puffed out his chest. \"I declare that I desire a Chocolate Chip cookie!\"", "segments": [{"text": "Pip puffed out his chest.", "speaker": "narrator", "is_quote": false}, {"text": "I declare that I desire a Chocolate Chip cookie!", "speaker": "pip", "is_quote": true}]}, {"raw": "Pip picked up a cookie, opened his snout wide, and took a big, crunchy bite.", "segments": [{"text": "Pip picked up a cookie, opened his snout wide, and took a big, crunchy bite.", "speaker": "narrator", "is_quote": false}]}, {"raw": "His amber eyes rolled back into his furry head. \"GOOD SWEET GINGERBREAD! That is... that is mathematically, scientifically, the single greatest chocolate chip cookie in the history of the universe! The molten cacao! The brown sugar ratio! It is a masterpiece!\"", "segments": [{"text": "His amber eyes rolled back into his furry head.", "speaker": "narrator", "is_quote": false}, {"text": "GOOD SWEET GINGERBREAD! That is... that is mathematically, scientifically, the single greatest chocolate chip cookie in the history of the universe! The molten cacao! The brown sugar ratio! It is a masterpiece!", "speaker": "narrator", "is_quote": true}]}, {"raw": "Pip began chewing with furious delight.", "segments": [{"text": "Pip began chewing with furious delight.", "speaker": "narrator", "is_quote": false}]}, {"raw": "As he chewed, his eyes drifted toward the crackling fireplace. \"Though... now that I reflect upon the winter season... gingerbread has always been the superior festive biscuit. A touch of molasses, a bite of clove...\"", "segments": [{"text": "As he chewed, his eyes drifted toward the crackling fireplace.", "speaker": "narrator", "is_quote": false}, {"text": "Though... now that I reflect upon the winter season... gingerbread has always been the superior festive biscuit. A touch of molasses, a bite of clove...", "speaker": "narrator", "is_quote": true}]}, {"raw": "FLASH!", "segments": [{"text": "FLASH!", "speaker": "narrator", "is_quote": false}]}, {"raw": "Right inside Pip’s mouth, a tiny puff of golden cinnamon sparkles puffed out of his nostrils!", "segments": [{"text": "Right inside Pip’s mouth, a tiny puff of golden cinnamon sparkles puffed out of his nostrils!", "speaker": "narrator", "is_quote": false}]}, {"raw": "Pip’s jaw froze mid-chew. His ears shot straight up like two radio antennas.", "segments": [{"text": "Pip’s jaw froze mid-chew. His ears shot straight up like two radio antennas.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"WHA—?!\" Pip gasped, his eyes bulging. \"MY CHOCOLATE CHIP JUST WENT CLOVE! IT'S WARM! IT'S SPICY! IT TURNED INTO GINGERBREAD IN THE MIDDLE OF MY TEETH! MADAME, YOUR BAKING IS DEFYING THE LAWS OF THERMODYNAMICS!\"", "segments": [{"text": "WHA—?!", "speaker": "pip", "is_quote": true}, {"text": "Pip gasped, his eyes bulging.", "speaker": "narrator", "is_quote": false}, {"text": "MY CHOCOLATE CHIP JUST WENT CLOVE! IT'S WARM! IT'S SPICY! IT TURNED INTO GINGERBREAD IN THE MIDDLE OF MY TEETH! MADAME, YOUR BAKING IS DEFYING THE LAWS OF THERMODYNAMICS!", "speaker": "pip", "is_quote": true}]}, {"raw": "Granny winked at you. \"Go on, sweetheart. Try yours.\"", "segments": [{"text": "Granny winked at you.", "speaker": "narrator", "is_quote": false}, {"text": "Go on, sweetheart. Try yours.", "speaker": "granny", "is_quote": true}]}, {"raw": "You pick up a warm, sugar-dusted cookie. As you lift it to your mouth, you're still thinking about Pip's gingerbread.", "segments": [{"text": "You pick up a warm, sugar-dusted cookie. As you lift it to your mouth, you're still thinking about Pip's gingerbread.", "speaker": "narrator", "is_quote": false}]}, {"raw": "You take a bite—and the rich, sweet warmth of ginger and molasses explodes across your tongue, crunchy on the edges and soft in the middle.", "segments": [{"text": "You take a bite—and the rich, sweet warmth of ginger and molasses explodes across your tongue, crunchy on the edges and soft in the middle.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Wow, you think, savoring the flavor. This would be amazing with a mug of hot chocolate.", "segments": [{"text": "Wow, you think, savoring the flavor. This would be amazing with a mug of hot chocolate.", "speaker": "narrator", "is_quote": false}]}, {"raw": "POOF.", "segments": [{"text": "POOF.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Instantly, the center of the cookie turns into a warm, creamy, velvety pocket of rich melted marshmallow and molten hot cocoa, coating your mouth in sweet, silky chocolate!", "segments": [{"text": "Instantly, the center of the cookie turns into a warm, creamy, velvety pocket of rich melted marshmallow and molten hot cocoa, coating your mouth in sweet, silky chocolate!", "speaker": "narrator", "is_quote": false}]}, {"raw": "You laugh out loud, your eyes wide with pure wonder. \"It really is magic!\"", "segments": [{"text": "You laugh out loud, your eyes wide with pure wonder.", "speaker": "narrator", "is_quote": false}, {"text": "It really is magic!", "speaker": "narrator", "is_quote": true}]}], "image": {"src": "images/grannys_hearth_shapeshifting_cookies_1795408941006.jpg", "alt": "Illustration: Granny's Hearth & The Shapeshifting Cookies"}, "choices": [{"id": "c5p5_next", "label": {"standard": "Turn the page", "short": "Turn the page"}, "goto": "c5p6"}]}, "c5p6": {"id": "c5p6", "chapter": 5, "chapter_title": "The Gift of the Unbound & Granny's Hearth", "title": "The Bravest Dog in Everfrost & The Choice", "paragraphs": [{"raw": "With the feast finished, the clock on the wall gave a heavy tick: TICK-TOCK.", "segments": [{"text": "With the feast finished, the clock on the wall gave a heavy tick: TICK-TOCK.", "speaker": "narrator", "is_quote": false}]}, {"raw": "The velvet carrying case containing the Forward Escapement Gear rested by the door. It was time to go.", "segments": [{"text": "The velvet carrying case containing the Forward Escapement Gear rested by the door. It was time to go.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Granny walked over to Titan, who was sitting politely on his haunches, his big brown eyes filled with deep, soulful gratitude.", "segments": [{"text": "Granny walked over to Titan, who was sitting politely on his haunches, his big brown eyes filled with deep, soulful gratitude.", "speaker": "narrator", "is_quote": false}]}, {"raw": "From her apron pocket, Granny pulled out a special, hand-stitched burlap pouch tied with a bright red velvet ribbon. Inside were five massive, bone-shaped cookies that smelled like sweet smoke, bacon, and golden honey.", "segments": [{"text": "From her apron pocket, Granny pulled out a special, hand-stitched burlap pouch tied with a bright red velvet ribbon. Inside were five massive, bone-shaped cookies that smelled like sweet smoke, bacon, and golden honey.", "speaker": "narrator", "is_quote": false}]}, {"raw": "She reached out with both hands and gave Titan the most glorious, double-handed scratch right behind his black-freckled ears.", "segments": [{"text": "She reached out with both hands and gave Titan the most glorious, double-handed scratch right behind his black-freckled ears.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Titan closed his eyes in pure bulldog heaven, letting out a deep, rumble-snore of utter contentment.", "segments": [{"text": "Titan closed his eyes in pure bulldog heaven, letting out a deep, rumble-snore of utter contentment.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"These are for you, sweet boy,\" Granny whispered into his ear. \"Whenever you feel frightened... whenever the dark seems too big or the noise seems too loud... you eat one of these Courage Nubbies. And you remember that you are the bravest, strongest, most wonderful dog in the world.\"", "segments": [{"text": "These are for you, sweet boy,", "speaker": "granny", "is_quote": true}, {"text": "Granny whispered into his ear.", "speaker": "narrator", "is_quote": false}, {"text": "Whenever you feel frightened... whenever the dark seems too big or the noise seems too loud... you eat one of these Courage Nubbies. And you remember that you are the bravest, strongest, most wonderful dog in the world.", "speaker": "granny", "is_quote": true}]}, {"raw": "Titan took the ribbon gently between his massive jowls. He held the bag as if it were made of spun glass, his little docked tail buzzing with quiet, fierce loyalty.", "segments": [{"text": "Titan took the ribbon gently between his massive jowls. He held the bag as if it were made of spun glass, his little docked tail buzzing with quiet, fierce loyalty.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Barnaby picked up his heavy iron pipe wrench and patted his braided beard.", "segments": [{"text": "Barnaby picked up his heavy iron pipe wrench and patted his braided beard.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"The Grand Clock sits in the center of the village plaza,\" Barnaby said, his voice turning serious. \"The lower gates are locked down tight by the Nutcracker guard battalions. But Titan's peppermint balloon can hover right over the high spires when the time comes.\"", "segments": [{"text": "The Grand Clock sits in the center of the village plaza,", "speaker": "barnaby", "is_quote": true}, {"text": "Barnaby said, his voice turning serious.", "speaker": "narrator", "is_quote": false}, {"text": "The lower gates are locked down tight by the Nutcracker guard battalions. But Titan's peppermint balloon can hover right over the high spires when the time comes.", "speaker": "barnaby", "is_quote": true}]}, {"raw": "You pick up the velvet case containing the Master Cog.", "segments": [{"text": "You pick up the velvet case containing the Master Cog.", "speaker": "narrator", "is_quote": false}]}, {"raw": "How does the team approach the Grand Clock Tower?", "segments": [{"text": "How does the team approach the Grand Clock Tower?", "speaker": "narrator", "is_quote": false}]}], "image": {"src": "images/grannys_hearth_shapeshifting_cookies_1795408941006.jpg", "alt": "Illustration: Granny's Hearth & The Shapeshifting Cookies"}, "choices": [{"id": "c5p6_a", "label": {"standard": "The Sky Infiltration! (Titan flies the balloon into the high clouds, and you and Pip drop directly onto the upper clockwork bell balcony!)", "short": "The Sky Infiltration! (Titan flies the balloon into the high clouds, and you and Pip drop directly onto the upper clockwork bell balcony!)"}, "goto": "c6p1"}, {"id": "c5p6_b", "label": {"standard": "The Frozen Sluice-Way! (Barnaby guides you through the underground steam ducts, emerging right inside the lower gear room!)", "short": "The Frozen Sluice-Way! (Barnaby guides you through the underground steam ducts, emerging right inside the lower gear room!)"}, "goto": "c6p1"}]}, "c6p1": {"id": "c6p1", "chapter": 6, "chapter_title": "The Fall of Pip & The Rise of Titan", "title": "Captured in the Gear Chamber", "paragraphs": [{"raw": "The heat and thunder inside the Grand Clock was deafening.", "segments": [{"text": "The heat and thunder inside the Grand Clock was deafening.", "speaker": "narrator", "is_quote": false}]}, {"raw": "You and Barnaby scrambled onto the high glass platform directly in front of the Great Pendulum. Above your head, the massive, backwards-spinning spiral of black iron groaned as it forced time in reverse.", "segments": [{"text": "You and Barnaby scrambled onto the high glass platform directly in front of the Great Pendulum. Above your head, the massive, backwards-spinning spiral of black iron groaned as it forced time in reverse.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"The housing is right there!\" Barnaby yelled, pointing his heavy wrench at the center shaft. \"Unlatch the black spiral! Quick, before the clock strikes ten!\"", "segments": [{"text": "The housing is right there!", "speaker": "barnaby", "is_quote": true}, {"text": "Barnaby yelled, pointing his heavy wrench at the center shaft.", "speaker": "narrator", "is_quote": false}, {"text": "Unlatch the black spiral! Quick, before the clock strikes ten!", "speaker": "barnaby", "is_quote": true}]}, {"raw": "You reach into the velvet case, pulling out Barnaby's glowing star-silver Forward Cog.", "segments": [{"text": "You reach into the velvet case, pulling out Barnaby's glowing star-silver Forward Cog.", "speaker": "narrator", "is_quote": false}]}, {"raw": "CLANG!", "segments": [{"text": "CLANG!", "speaker": "narrator", "is_quote": false}]}, {"raw": "A heavy iron cage dropped from the ceiling rafters with a violent crash, slamming over Barnaby and pinning him to the floor!", "segments": [{"text": "A heavy iron cage dropped from the ceiling rafters with a violent crash, slamming over Barnaby and pinning him to the floor!", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"BARNABY!\" you scream.", "segments": [{"text": "BARNABY!", "speaker": "narrator", "is_quote": true}, {"text": "you scream.", "speaker": "narrator", "is_quote": false}]}, {"raw": "From the shadows behind the pendulum stepped the Clockmaker, his dark velvet coat swirling with constellations of silver clock hands. In his brass-tipped fingers, he held the remote iron winch.", "segments": [{"text": "From the shadows behind the pendulum stepped the Clockmaker, his dark velvet coat swirling with constellations of silver clock hands. In his brass-tipped fingers, he held the remote iron winch.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"A pathetic effort, my old apprentice,\" the Clockmaker sneered, his cold gray eyes glaring through the cage bars at Barnaby. \"You will spend the rest of your immortal days locked in this iron cage, forced to oil the very gears that will keep Everfrost frozen in Christmas forever!\"", "segments": [{"text": "A pathetic effort, my old apprentice,", "speaker": "barnaby", "is_quote": true}, {"text": "the Clockmaker sneered, his cold gray eyes glaring through the cage bars at Barnaby.", "speaker": "narrator", "is_quote": false}, {"text": "You will spend the rest of your immortal days locked in this iron cage, forced to oil the very gears that will keep Everfrost frozen in Christmas forever!", "speaker": "barnaby", "is_quote": true}]}, {"raw": "\"Run!\" Barnaby roared, rattling the iron bars with his fists. \"Run, child! Save tomorrow!\"", "segments": [{"text": "Run!", "speaker": "barnaby", "is_quote": true}, {"text": "Barnaby roared, rattling the iron bars with his fists.", "speaker": "narrator", "is_quote": false}, {"text": "Run, child! Save tomorrow!", "speaker": "barnaby", "is_quote": true}]}, {"raw": "You clutch the heavy silver cog against your chest and sprint across the narrow catwalk toward the pendulum housing. You're five feet away. Three feet away.", "segments": [{"text": "You clutch the heavy silver cog against your chest and sprint across the narrow catwalk toward the pendulum housing. You're five feet away. Three feet away.", "speaker": "narrator", "is_quote": false}]}, {"raw": "You reach out to slam the cog into the gears—", "segments": [{"text": "You reach out to slam the cog into the gears—", "speaker": "narrator", "is_quote": false}]}, {"raw": "SNAP!", "segments": [{"text": "SNAP!", "speaker": "narrator", "is_quote": false}]}, {"raw": "The Clockmaker appeared at the end of the catwalk, his black obsidian pocket-watch glowing with blinding, violent purple lightning.", "segments": [{"text": "The Clockmaker appeared at the end of the catwalk, his black obsidian pocket-watch glowing with blinding, violent purple lightning.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"You will not touch my machine, Unbound,\" the Clockmaker hissed. \"If time will not erase you... I will erase you from the story myself!\"", "segments": [{"text": "You will not touch my machine, Unbound,", "speaker": "clockmaker", "is_quote": true}, {"text": "the Clockmaker hissed.", "speaker": "narrator", "is_quote": false}, {"text": "If time will not erase you... I will erase you from the story myself!", "speaker": "clockmaker", "is_quote": true}]}], "image": null, "choices": [{"id": "c6p1_next", "label": {"standard": "Turn the page", "short": "Turn the page"}, "goto": "c6p2"}]}, "c6p2": {"id": "c6p2", "chapter": 6, "chapter_title": "The Fall of Pip & The Rise of Titan", "title": "Pip's Sacrifice", "paragraphs": [{"raw": "The Clockmaker thrust his obsidian watch forward.", "segments": [{"text": "The Clockmaker thrust his obsidian watch forward.", "speaker": "narrator", "is_quote": false}]}, {"raw": "A roaring, crackling beam of purple temporal disintegration shot across the catwalk straight toward your chest! The beam was so cold it froze the air solid, crackling with raw, erasing power.", "segments": [{"text": "A roaring, crackling beam of purple temporal disintegration shot across the catwalk straight toward your chest! The beam was so cold it froze the air solid, crackling with raw, erasing power.", "speaker": "narrator", "is_quote": false}]}, {"raw": "You can't move. You can't dodge. The beam is inches from your eyes.", "segments": [{"text": "You can't move. You can't dodge. The beam is inches from your eyes.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Suddenly, a blur of red wool and green tweed tackled you from the side!", "segments": [{"text": "Suddenly, a blur of red wool and green tweed tackled you from the side!", "speaker": "narrator", "is_quote": false}]}, {"raw": "OOF!", "segments": [{"text": "OOF!", "speaker": "narrator", "is_quote": false}]}, {"raw": "You crash violently onto the steel grating, out of the beam's deadly path.", "segments": [{"text": "You crash violently onto the steel grating, out of the beam's deadly path.", "speaker": "narrator", "is_quote": false}]}, {"raw": "The purple lightning struck Pip directly in the chest.", "segments": [{"text": "The purple lightning struck Pip directly in the chest.", "speaker": "narrator", "is_quote": false}]}, {"raw": "CRACK-BOOOOOOOM!", "segments": [{"text": "CRACK-BOOOOOOOM!", "speaker": "narrator", "is_quote": false}]}, {"raw": "A blinding shockwave of violet light tore through the chamber.", "segments": [{"text": "A blinding shockwave of violet light tore through the chamber.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"PIP!\" you scream, scrambling on your hands and knees toward him.", "segments": [{"text": "PIP!", "speaker": "narrator", "is_quote": true}, {"text": "you scream, scrambling on your hands and knees toward him.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Pip was lying on the iron catwalk. The purple magic didn't hurt him—it was doing something far worse. His body was slowly turning translucent, dissolving into shimmering swirls of silver and lavender snowflakes.", "segments": [{"text": "Pip was lying on the iron catwalk. The purple magic didn't hurt him—it was doing something far worse. His body was slowly turning translucent, dissolving into shimmering swirls of silver and lavender snowflakes.", "speaker": "narrator", "is_quote": false}]}, {"raw": "The velvet carrying case slipped from your hands, and the silver Forward Cog skittered across the metal floorboards, stopping right against the Clockmaker's boots.", "segments": [{"text": "The velvet carrying case slipped from your hands, and the silver Forward Cog skittered across the metal floorboards, stopping right against the Clockmaker's boots.", "speaker": "narrator", "is_quote": false}]}, {"raw": "You slide to Pip’s side and reach out, but your gloved fingers pass right through his shoulder.", "segments": [{"text": "You slide to Pip’s side and reach out, but your gloved fingers pass right through his shoulder.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Pip... no! Pip, hold on!\" Tears burn in your eyes. \"Don't go!\"", "segments": [{"text": "Pip... no! Pip, hold on!", "speaker": "narrator", "is_quote": true}, {"text": "Tears burn in your eyes.", "speaker": "narrator", "is_quote": false}, {"text": "Don't go!", "speaker": "narrator", "is_quote": true}]}, {"raw": "Pip looked up at you.", "segments": [{"text": "Pip looked up at you.", "speaker": "narrator", "is_quote": false}]}, {"raw": "His exaggerated, silly British accent was completely gone. His yellow eyes were clear, soft, and filled with a fierce, quiet love that broke your heart.", "segments": [{"text": "His exaggerated, silly British accent was completely gone. His yellow eyes were clear, soft, and filled with a fierce, quiet love that broke your heart.", "speaker": "narrator", "is_quote": false}]}, {"raw": "With trembling, fading paws, he weakly reached up toward your face.", "segments": [{"text": "With trembling, fading paws, he weakly reached up toward your face.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Listen to me, recruit...\" Pip whispered, his voice faint like a fading winter echo. \"I'm not... I'm not really a master detective. I never was. I was just... a lonely little fox who wanted to be someone important.\"", "segments": [{"text": "Listen to me, recruit...", "speaker": "pip", "is_quote": true}, {"text": "Pip whispered, his voice faint like a fading winter echo.", "speaker": "narrator", "is_quote": false}, {"text": "I'm not... I'm not really a master detective. I never was. I was just... a lonely little fox who wanted to be someone important.", "speaker": "pip", "is_quote": true}]}, {"raw": "A single tear rolled through the fur on Pip's cheek.", "segments": [{"text": "A single tear rolled through the fur on Pip's cheek.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"But you... you made me feel like a hero. You're the Unbound. I believe in you... I know you can fix the clock.\"", "segments": [{"text": "But you... you made me feel like a hero. You're the Unbound. I believe in you... I know you can fix the clock.", "speaker": "narrator", "is_quote": true}]}, {"raw": "Pip’s body faded into shimmering light, up to his chest, up to his whiskers.", "segments": [{"text": "Pip’s body faded into shimmering light, up to his chest, up to his whiskers.", "speaker": "narrator", "is_quote": false}]}, {"raw": "He smiled a soft, peaceful, unpretentious smile.", "segments": [{"text": "He smiled a soft, peaceful, unpretentious smile.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Thank you...\" Pip whispered into the freezing air, \"...for being my friend.\"", "segments": [{"text": "Thank you...", "speaker": "pip", "is_quote": true}, {"text": "Pip whispered into the freezing air,", "speaker": "narrator", "is_quote": false}, {"text": "...for being my friend.", "speaker": "pip", "is_quote": true}]}, {"raw": "POOF.", "segments": [{"text": "POOF.", "speaker": "narrator", "is_quote": false}]}, {"raw": "With a gentle burst of golden sparks, Pip vanished completely.", "segments": [{"text": "With a gentle burst of golden sparks, Pip vanished completely.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Only his crooked houndstooth detective cap and his tattered little notebook clattered onto the cold iron floor.", "segments": [{"text": "Only his crooked houndstooth detective cap and his tattered little notebook clattered onto the cold iron floor.", "speaker": "narrator", "is_quote": false}]}], "image": {"src": "images/pip_heroic_sacrifice_1795409272142.jpg", "alt": "Illustration: Pip's Heroic Sacrifice"}, "choices": [{"id": "c6p2_next", "label": {"standard": "Turn the page", "short": "Turn the page"}, "goto": "c6p3"}]}, "c6p3": {"id": "c6p3", "chapter": 6, "chapter_title": "The Fall of Pip & The Rise of Titan", "title": "The Gloating Clockmaker", "paragraphs": [{"raw": "Silence filled the cavernous chamber. Only the slow, backwards ticking of the Great Clock echoed through the dark:", "segments": [{"text": "Silence filled the cavernous chamber. Only the slow, backwards ticking of the Great Clock echoed through the dark:", "speaker": "narrator", "is_quote": false}]}, {"raw": "TICK... TOCK... TICK...", "segments": [{"text": "TICK... TOCK... TICK...", "speaker": "narrator", "is_quote": false}]}, {"raw": "You pick up Pip’s crooked tweed hat, clutching it against your chest as tears stream down your cheeks.", "segments": [{"text": "You pick up Pip’s crooked tweed hat, clutching it against your chest as tears stream down your cheeks.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Heavy wooden boots stomped onto the catwalk. Two nine-foot Clockwork Praetorians seized you by the arms, twisting your hands behind your back and forcing you to your knees.", "segments": [{"text": "Heavy wooden boots stomped onto the catwalk. Two nine-foot Clockwork Praetorians seized you by the arms, twisting your hands behind your back and forcing you to your knees.", "speaker": "narrator", "is_quote": false}]}, {"raw": "The Clockmaker bent down, picked up Barnaby's forged silver cog with his brass-tipped fingers, and examined it with a cruel, mocking smile.", "segments": [{"text": "The Clockmaker bent down, picked up Barnaby's forged silver cog with his brass-tipped fingers, and examined it with a cruel, mocking smile.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Such exquisite craftsmanship,\" the Clockmaker murmured. \"A pity it will never turn.\"", "segments": [{"text": "Such exquisite craftsmanship,", "speaker": "clockmaker", "is_quote": true}, {"text": "the Clockmaker murmured.", "speaker": "narrator", "is_quote": false}, {"text": "A pity it will never turn.", "speaker": "clockmaker", "is_quote": true}]}, {"raw": "The Clockmaker walked slowly toward you, standing over you on the catwalk. He looked down with cold, venomous triumph.", "segments": [{"text": "The Clockmaker walked slowly toward you, standing over you on the catwalk. He looked down with cold, venomous triumph.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Look at you, Unbound,\" the Clockmaker sneered, his voice booming through the cathedral of gears. \"Captured. Defeated. Alone. Your little fox is erased from existence. Your master-smith is locked in an iron cage. You have NO ONE left to help you!\"", "segments": [{"text": "Look at you, Unbound,", "speaker": "clockmaker", "is_quote": true}, {"text": "the Clockmaker sneered, his voice booming through the cathedral of gears.", "speaker": "narrator", "is_quote": false}, {"text": "Captured. Defeated. Alone. Your little fox is erased from existence. Your master-smith is locked in an iron cage. You have NO ONE left to help you!", "speaker": "clockmaker", "is_quote": true}]}, {"raw": "He leaned in close, his silver hair glinting in the dark.", "segments": [{"text": "He leaned in close, his silver hair glinting in the dark.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"You will never touch the Great Clock. You will never stop the reverse countdown. And you will never see your friends or your world ever again.\"", "segments": [{"text": "You will never touch the Great Clock. You will never stop the reverse countdown. And you will never see your friends or your world ever again.", "speaker": "narrator", "is_quote": true}]}, {"raw": "He raised his obsidian pocket-watch, preparing to lock you in chains forever.", "segments": [{"text": "He raised his obsidian pocket-watch, preparing to lock you in chains forever.", "speaker": "narrator", "is_quote": false}]}, {"raw": "And that's when you hear it.", "segments": [{"text": "And that's when you hear it.", "speaker": "narrator", "is_quote": false}]}], "image": {"src": "images/pip_heroic_sacrifice_1795409272142.jpg", "alt": "Illustration: Pip's Heroic Sacrifice"}, "choices": [{"id": "c6p3_next", "label": {"standard": "Turn the page", "short": "Turn the page"}, "goto": "c6p4"}]}, "c6p4": {"id": "c6p4", "chapter": 6, "chapter_title": "The Fall of Pip & The Rise of Titan", "title": "The Thunder from the Sky", "paragraphs": [{"raw": "ROOOOOOOOOOOOOOOOAR!", "segments": [{"text": "ROOOOOOOOOOOOOOOOAR!", "speaker": "narrator", "is_quote": false}]}, {"raw": "It didn't sound like a dog. It sounded like an avalanche of thunder ripping through the heavens!", "segments": [{"text": "It didn't sound like a dog. It sounded like an avalanche of thunder ripping through the heavens!", "speaker": "narrator", "is_quote": false}]}, {"raw": "The entire five-hundred-foot tower shuddered to its very foundation! Dust and icicles rained down from the iron rafters!", "segments": [{"text": "The entire five-hundred-foot tower shuddered to its very foundation! Dust and icicles rained down from the iron rafters!", "speaker": "narrator", "is_quote": false}]}, {"raw": "The Clockmaker froze mid-sentence, his eyes darting upward in utter shock.", "segments": [{"text": "The Clockmaker froze mid-sentence, his eyes darting upward in utter shock.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"What in St. Nick's name is that?!\"", "segments": [{"text": "What in St. Nick's name is that?!", "speaker": "narrator", "is_quote": true}]}, {"raw": "CRRRRRRRRR-AAAAAASH!", "segments": [{"text": "CRRRRRRRRR-AAAAAASH!", "speaker": "narrator", "is_quote": false}]}, {"raw": "The massive stained-glass skylight four hundred feet above the clock tower shattered into a million glittering shards of colored glass!", "segments": [{"text": "The massive stained-glass skylight four hundred feet above the clock tower shattered into a million glittering shards of colored glass!", "speaker": "narrator", "is_quote": false}]}, {"raw": "Falling straight out of the snowy night sky, surrounded by swirling clouds of red-and-white peppermint canvas and roaring propane flame, was a shadow.", "segments": [{"text": "Falling straight out of the snowy night sky, surrounded by swirling clouds of red-and-white peppermint canvas and roaring propane flame, was a shadow.", "speaker": "narrator", "is_quote": false}]}, {"raw": "A colossal, white, muscular shadow.", "segments": [{"text": "A colossal, white, muscular shadow.", "speaker": "narrator", "is_quote": false}]}, {"raw": "BOOOOOOOOOOOOOOOOM!", "segments": [{"text": "BOOOOOOOOOOOOOOOOM!", "speaker": "narrator", "is_quote": false}]}, {"raw": "The creature landed in the center of the iron platform with an earth-shattering crash that bent the steel girders and sent the Clockwork Praetorians staggering!", "segments": [{"text": "The creature landed in the center of the iron platform with an earth-shattering crash that bent the steel girders and sent the Clockwork Praetorians staggering!", "speaker": "narrator", "is_quote": false}]}, {"raw": "It was Titan.", "segments": [{"text": "It was Titan.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Except... Titan didn't look like a normal bulldog anymore.", "segments": [{"text": "Except... Titan didn't look like a normal bulldog anymore.", "speaker": "narrator", "is_quote": false}]}, {"raw": "He was standing on all four massive, tree-trunk paws. He was already the size of a grizzly bear—easily ten feet tall at the shoulders, his white coat gleaming like fresh glacier ice, his black freckles standing out like war paint!", "segments": [{"text": "He was standing on all four massive, tree-trunk paws. He was already the size of a grizzly bear—easily ten feet tall at the shoulders, his white coat gleaming like fresh glacier ice, his black freckles standing out like war paint!", "speaker": "narrator", "is_quote": false}]}, {"raw": "Clutched in his giant front paw was Granny's hand-stitched burlap pouch.", "segments": [{"text": "Clutched in his giant front paw was Granny's hand-stitched burlap pouch.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Titan looked at the soldiers holding you. He looked at Pip's empty hat lying on the grating.", "segments": [{"text": "Titan looked at the soldiers holding you. He looked at Pip's empty hat lying on the grating.", "speaker": "narrator", "is_quote": false}]}, {"raw": "A low, deep, volcanic growl rumbled in Titan's massive chest, so powerful it rattled your teeth inside your skull.", "segments": [{"text": "A low, deep, volcanic growl rumbled in Titan's massive chest, so powerful it rattled your teeth inside your skull.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Without breaking eye contact with the Clockmaker, the giant bulldog reached into the pouch, pulled out another of Granny's Courage Nubbies, and popped it into his mouth.", "segments": [{"text": "Without breaking eye contact with the Clockmaker, the giant bulldog reached into the pouch, pulled out another of Granny's Courage Nubbies, and popped it into his mouth.", "speaker": "narrator", "is_quote": false}]}, {"raw": "CHOMP.", "segments": [{"text": "CHOMP.", "speaker": "narrator", "is_quote": false}]}, {"raw": "You swear, right before your very eyes...", "segments": [{"text": "You swear, right before your very eyes...", "speaker": "narrator", "is_quote": false}]}, {"raw": "HE GOT BIGGER.", "segments": [{"text": "HE GOT BIGGER.", "speaker": "narrator", "is_quote": false}]}, {"raw": "His muscular shoulders swelled to the size of steam engines! His broad chest expanded until he stood twenty feet tall, his little docked nub tail buzzing with fierce, unstoppable protective fury!", "segments": [{"text": "His muscular shoulders swelled to the size of steam engines! His broad chest expanded until he stood twenty feet tall, his little docked nub tail buzzing with fierce, unstoppable protective fury!", "speaker": "narrator", "is_quote": false}]}, {"raw": "The Clockmaker backed away, his obsidian watch trembling in his hand.", "segments": [{"text": "The Clockmaker backed away, his obsidian watch trembling in his hand.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"W-What is that thing?!\" the Clockmaker stammered in horror.", "segments": [{"text": "W-What is that thing?!", "speaker": "clockmaker", "is_quote": true}, {"text": "the Clockmaker stammered in horror.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Titan looked down at the Clockmaker with glowing, fearless brown eyes. When he spoke, his voice was a thunderous, room-shaking roar that shook the very gears of the universe:", "segments": [{"text": "Titan looked down at the Clockmaker with glowing, fearless brown eyes. When he spoke, his voice was a thunderous, room-shaking roar that shook the very gears of the universe:", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"I AM TITAN. AND NOBODY TOUCHES MY FRIEND.\"", "segments": [{"text": "I AM TITAN. AND NOBODY TOUCHES MY FRIEND.", "speaker": "titan", "is_quote": true}]}], "image": {"src": "images/titan_colossal_battle_hound_1795409952427.jpg", "alt": "Illustration: The Rise of Titan — Colossal Battle-Hound"}, "choices": [{"id": "c6p4_next", "label": {"standard": "Turn the page", "short": "Turn the page"}, "goto": "c7p1"}]}, "c7p1": {"id": "c7p1", "chapter": 7, "chapter_title": "The Master of Tomorrow", "title": "\"I Smell Chewy Wood!\"", "paragraphs": [{"raw": "The five-hundred-foot clock tower trembled under Titan’s colossal weight.", "segments": [{"text": "The five-hundred-foot clock tower trembled under Titan’s colossal weight.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Standing twenty feet tall, his massive white shoulders glowing with raw Courage-Nubbie power, Titan lowered his square, black-freckled snout right down to the catwalk. His nostrils flared like two steam vents:", "segments": [{"text": "Standing twenty feet tall, his massive white shoulders glowing with raw Courage-Nubbie power, Titan lowered his square, black-freckled snout right down to the catwalk. His nostrils flared like two steam vents:", "speaker": "narrator", "is_quote": false}]}, {"raw": "SNIIIIIIIIFFFF.", "segments": [{"text": "SNIIIIIIIIFFFF.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Titan’s big brown eyes lit up with ecstatic recognition.", "segments": [{"text": "Titan’s big brown eyes lit up with ecstatic recognition.", "speaker": "narrator", "is_quote": false}]}, {"raw": "He stared down at the six elite Clockwork Praetorians, who were frozen mid-stride, their wooden knees knocking together: clatter-clatter-clatter.", "segments": [{"text": "He stared down at the six elite Clockwork Praetorians, who were frozen mid-stride, their wooden knees knocking together: clatter-clatter-clatter.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Titan let out a thunderous, joyful bellow that shook the icicles from the rafters:", "segments": [{"text": "Titan let out a thunderous, joyful bellow that shook the icicles from the rafters:", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"I SMELL CHEWY WOOD!\"", "segments": [{"text": "I SMELL CHEWY WOOD!", "speaker": "titan", "is_quote": true}]}, {"raw": "\"RETREAT!\" the lead Praetorian clicked in screeching, wooden terror. \"THE CANINE MEGATHERIUM DESIRES FIBER CONSUMPTION!\"", "segments": [{"text": "RETREAT!", "speaker": "narrator", "is_quote": true}, {"text": "the lead Praetorian clicked in screeching, wooden terror.", "speaker": "narrator", "is_quote": false}, {"text": "THE CANINE MEGATHERIUM DESIRES FIBER CONSUMPTION!", "speaker": "narrator", "is_quote": true}]}, {"raw": "SMASH!", "segments": [{"text": "SMASH!", "speaker": "narrator", "is_quote": false}]}, {"raw": "Titan swiped a colossal front paw like a snowplow!", "segments": [{"text": "Titan swiped a colossal front paw like a snowplow!", "speaker": "narrator", "is_quote": false}]}, {"raw": "Three Praetorian guards went flying through the air like wooden bowling pins, smashing into kindling against the iron girders!", "segments": [{"text": "Three Praetorian guards went flying through the air like wooden bowling pins, smashing into kindling against the iron girders!", "speaker": "narrator", "is_quote": false}]}, {"raw": "With his other paw, Titan casually backhanded Barnaby’s iron cage.", "segments": [{"text": "With his other paw, Titan casually backhanded Barnaby’s iron cage.", "speaker": "narrator", "is_quote": false}]}, {"raw": "CRUNCH!", "segments": [{"text": "CRUNCH!", "speaker": "narrator", "is_quote": false}]}, {"raw": "The four-inch iron bars snapped like dry pretzels. Barnaby tumbled out onto the platform, gripping his pipe wrench with a roar: \"THAT'S MY BOY!\"", "segments": [{"text": "The four-inch iron bars snapped like dry pretzels. Barnaby tumbled out onto the platform, gripping his pipe wrench with a roar:", "speaker": "narrator", "is_quote": false}, {"text": "THAT'S MY BOY!", "speaker": "pip", "is_quote": true}]}, {"raw": "The Clockmaker lunged forward, trying to grab his obsidian pocket-watch off the floor, but Titan planted his massive front paw right on the Clockmaker's velvet coattails, pinning him flat to the metal grating!", "segments": [{"text": "The Clockmaker lunged forward, trying to grab his obsidian pocket-watch off the floor, but Titan planted his massive front paw right on the Clockmaker's velvet coattails, pinning him flat to the metal grating!", "speaker": "narrator", "is_quote": false}]}, {"raw": "THUD.", "segments": [{"text": "THUD.", "speaker": "narrator", "is_quote": false}]}, {"raw": "The silver Forward Escapement Gear flew from the Clockmaker’s grip, spinning across the glass floor and landing right at your feet.", "segments": [{"text": "The silver Forward Escapement Gear flew from the Clockmaker’s grip, spinning across the glass floor and landing right at your feet.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Titan looked down at you, his little docked nub tail wagging so hard it created a gentle breeze on the catwalk.", "segments": [{"text": "Titan looked down at you, his little docked nub tail wagging so hard it created a gentle breeze on the catwalk.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"GEAR SECURED, LITTLE FRIEND!\" Titan rumbled warmly, gently scooping the last three Praetorians into his mouth like pretzel sticks: CRUNCH-CRUNCH-SNAP! \"NOW GO FIX THAT CLOCK!\"", "segments": [{"text": "GEAR SECURED, LITTLE FRIEND!", "speaker": "titan", "is_quote": true}, {"text": "Titan rumbled warmly, gently scooping the last three Praetorians into his mouth like pretzel sticks: CRUNCH-CRUNCH-SNAP!", "speaker": "narrator", "is_quote": false}, {"text": "NOW GO FIX THAT CLOCK!", "speaker": "titan", "is_quote": true}]}], "image": {"src": "images/chapter_7_illustration_1_1795410032507.jpg", "alt": "Illustration: \"I Smell Chewy Wood!\""}, "choices": [{"id": "c7p1_next", "label": {"standard": "Turn the page", "short": "Turn the page"}, "goto": "c7p2"}]}, "c7p2": {"id": "c7p2", "chapter": 7, "chapter_title": "The Master of Tomorrow", "title": "The Heart of the Pendulum", "paragraphs": [{"raw": "You scoop up Barnaby's forged star-silver cog.", "segments": [{"text": "You scoop up Barnaby's forged star-silver cog.", "speaker": "narrator", "is_quote": false}]}, {"raw": "The Great Pendulum was swinging in wild, erratic arcs just ten feet in front of you. Purple temporal lightning crackled across the primary escapement.", "segments": [{"text": "The Great Pendulum was swinging in wild, erratic arcs just ten feet in front of you. Purple temporal lightning crackled across the primary escapement.", "speaker": "narrator", "is_quote": false}]}, {"raw": "High above the platform, the giant bronze clock face shuddered. The massive hour hand jerked backward toward the final zero mark.", "segments": [{"text": "High above the platform, the giant bronze clock face shuddered. The massive hour hand jerked backward toward the final zero mark.", "speaker": "narrator", "is_quote": false}]}, {"raw": "BONG.", "segments": [{"text": "BONG.", "speaker": "narrator", "is_quote": false}]}, {"raw": "One.", "segments": [{"text": "One.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Less than sixty seconds!\" Barnaby yelled, scrambling to his feet. \"Once it strikes zero, the magic locks! You have to disengage the black reverse-spiral!\"", "segments": [{"text": "Less than sixty seconds!", "speaker": "barnaby", "is_quote": true}, {"text": "Barnaby yelled, scrambling to his feet.", "speaker": "narrator", "is_quote": false}, {"text": "Once it strikes zero, the magic locks! You have to disengage the black reverse-spiral!", "speaker": "barnaby", "is_quote": true}]}, {"raw": "You leap onto the vibrating central balance platform.", "segments": [{"text": "You leap onto the vibrating central balance platform.", "speaker": "narrator", "is_quote": false}]}, {"raw": "In the center of the housing sits the Clockmaker's cursed mechanism: a jagged spiral of black iron locked tight with three heavy brass alignment pins.", "segments": [{"text": "In the center of the housing sits the Clockmaker's cursed mechanism: a jagged spiral of black iron locked tight with three heavy brass alignment pins.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Your mind hums with that quiet, extraordinary clarity. You are the Unbound.", "segments": [{"text": "Your mind hums with that quiet, extraordinary clarity. You are the Unbound.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Where anyone else would see a terrifying maze of spinning blades and crushing gears, your brain instantly sees the hidden rhythm—the subtle pause between ticks, the exact tension of the springs, the way the pieces breathe together.", "segments": [{"text": "Where anyone else would see a terrifying maze of spinning blades and crushing gears, your brain instantly sees the hidden rhythm—the subtle pause between ticks, the exact tension of the springs, the way the pieces breathe together.", "speaker": "narrator", "is_quote": false}]}, {"raw": "To remove the black spiral and lock the silver Forward Cog into place, which sequence do you execute?", "segments": [{"text": "To remove the black spiral and lock the silver Forward Cog into place, which sequence do you execute?", "speaker": "narrator", "is_quote": false}]}], "image": {"src": "images/chapter_7_illustration_1_1795410032507.jpg", "alt": "Illustration: \"I Smell Chewy Wood!\""}, "choices": [{"id": "c7p2_a", "label": {"standard": "Disengage the center balance pin on the upbeat of the pendulum swing! (Align with the rhythm of forward time!)", "short": "Disengage the center balance pin on the upbeat of the pendulum swing! (Align with the rhythm of forward time!)"}, "goto": "c7p3"}, {"id": "c7p2_b", "label": {"standard": "Jam your boot into the black spiral to force it to stop! (Brute-force the reverse gear!)", "short": "Jam your boot into the black spiral to force it to stop! (Brute-force the reverse gear!)"}, "goto": "c7p3"}, {"id": "c7p2_c", "label": {"standard": "Release the three outer brass tension springs simultaneously! (Cut off the dark temporal current!)", "short": "Release the three outer brass tension springs simultaneously! (Cut off the dark temporal current!)"}, "goto": "c7p3"}]}, "c7p3": {"id": "c7p3", "chapter": 7, "chapter_title": "The Master of Tomorrow", "title": "The Clock Strikes Forward", "paragraphs": [{"raw": "You don't fight the machinery. You listen to it.", "segments": [{"text": "You don't fight the machinery. You listen to it.", "speaker": "narrator", "is_quote": false}]}, {"raw": "You wait for the Great Pendulum to reach the absolute apex of its swing—that tiny fraction of a second where time holds its breath.", "segments": [{"text": "You wait for the Great Pendulum to reach the absolute apex of its swing—that tiny fraction of a second where time holds its breath.", "speaker": "narrator", "is_quote": false}]}, {"raw": "CLICK.", "segments": [{"text": "CLICK.", "speaker": "narrator", "is_quote": false}]}, {"raw": "You reach in with both hands, grasp the center balance pin, and twist!", "segments": [{"text": "You reach in with both hands, grasp the center balance pin, and twist!", "speaker": "narrator", "is_quote": false}]}, {"raw": "The black iron reverse-spiral snaps free!", "segments": [{"text": "The black iron reverse-spiral snaps free!", "speaker": "narrator", "is_quote": false}]}, {"raw": "You heave the dark, jagged metal out of the housing, hurling it down into the dark abyss of the tower!", "segments": [{"text": "You heave the dark, jagged metal out of the housing, hurling it down into the dark abyss of the tower!", "speaker": "narrator", "is_quote": false}]}, {"raw": "Before the pendulum can drop, you lift Barnaby's star-silver Forward Cog into the empty slot.", "segments": [{"text": "Before the pendulum can drop, you lift Barnaby's star-silver Forward Cog into the empty slot.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Its golden runes flare with blinding, warm light. You slide the cog onto the drive-shaft. The silver teeth mesh with the Great Wheel in a flawless, silky glide:", "segments": [{"text": "Its golden runes flare with blinding, warm light. You slide the cog onto the drive-shaft. The silver teeth mesh with the Great Wheel in a flawless, silky glide:", "speaker": "narrator", "is_quote": false}]}, {"raw": "CLIIIICK-CHUNKKKKK.", "segments": [{"text": "CLIIIICK-CHUNKKKKK.", "speaker": "narrator", "is_quote": false}]}, {"raw": "The Unbound spark inside your mind surges through your fingertips into the metal.", "segments": [{"text": "The Unbound spark inside your mind surges through your fingertips into the metal.", "speaker": "narrator", "is_quote": false}]}, {"raw": "For three seconds... absolute, dead silence.", "segments": [{"text": "For three seconds... absolute, dead silence.", "speaker": "narrator", "is_quote": false}]}, {"raw": "The Great Pendulum stops dead in the center.", "segments": [{"text": "The Great Pendulum stops dead in the center.", "speaker": "narrator", "is_quote": false}]}, {"raw": "The purple temporal lightning crackles... flickers... and shatters into a billion glittering golden dust motes!", "segments": [{"text": "The purple temporal lightning crackles... flickers... and shatters into a billion glittering golden dust motes!", "speaker": "narrator", "is_quote": false}]}, {"raw": "TICK.", "segments": [{"text": "TICK.", "speaker": "narrator", "is_quote": false}]}, {"raw": "The star-silver gear turns.", "segments": [{"text": "The star-silver gear turns.", "speaker": "narrator", "is_quote": false}]}, {"raw": "TOCK.", "segments": [{"text": "TOCK.", "speaker": "narrator", "is_quote": false}]}, {"raw": "The Great Pendulum swings FORWARD.", "segments": [{"text": "The Great Pendulum swings FORWARD.", "speaker": "narrator", "is_quote": false}]}, {"raw": "BOOOOOOOOOOOOOOOOONG!", "segments": [{"text": "BOOOOOOOOOOOOOOOOONG!", "speaker": "narrator", "is_quote": false}]}, {"raw": "A glorious, resonant, golden chime explodes from the tower bells, so sweet and triumphant it vibrates in your very bones!", "segments": [{"text": "A glorious, resonant, golden chime explodes from the tower bells, so sweet and triumphant it vibrates in your very bones!", "speaker": "narrator", "is_quote": false}]}, {"raw": "Blinding, radiant golden sunlight—the light of a million restored tomorrows—bursts from the Great Clock!", "segments": [{"text": "Blinding, radiant golden sunlight—the light of a million restored tomorrows—bursts from the Great Clock!", "speaker": "narrator", "is_quote": false}]}, {"raw": "The golden wave washes outward from the spire, sweeping across the dark rooftops of Everfrost. In an instant, every frosted cottage window blazes with warm amber light! The frozen canals glow with crystal warmth! The aurora sky clears into a brilliant, sparkling holiday twilight!", "segments": [{"text": "The golden wave washes outward from the spire, sweeping across the dark rooftops of Everfrost. In an instant, every frosted cottage window blazes with warm amber light! The frozen canals glow with crystal warmth! The aurora sky clears into a brilliant, sparkling holiday twilight!", "speaker": "narrator", "is_quote": false}]}, {"raw": "And far away, across the dimensional rifts, the golden light rushes into Arizona—melting the abnormal snow, thawing the cold fog, and washing over Oak C       'titan': { name: 'Titan the Bulldog', icon: '🐶', pitch: 0.65, rate: 0.86, voiceType: 'us_male' },
      'maya': { name: 'Maya / Mom', icon: '👧', pitch: 1.25, rate: 0.90, voiceType: 'us_female' },
      'soldier': { name: 'Wooden Soldier Commander', icon: '💂', pitch: 0.55, rate: 1.10, voiceType: 'us_male' },
      'barnaby': { name: 'Barnaby Grumble', icon: '🔨', pitch: 0.78, rate: 0.88, voiceType: 'us_male' },
      'granny': { name: 'Granny Grumble', icon: '👵', pitch: 1.10, rate: 0.84, voiceType: 'us_female' },
      'clockmaker': { name: 'The Clockmaker', icon: '🕰️', pitch: 0.82, rate: 0.94, voiceType: 'us_male' },
      'hero': { name: 'You (The Unbound)', icon: '⚡', pitch: 1.08, rate: 0.95, voiceType: 'us_narrator' }
    };

    // Load available voices and map specific voices to characters
    function loadVoices() {
      if (!synth) return;
      availableVoices = synth.getVoices().filter(v => v.lang.startsWith('en'));
      const picker = document.getElementById('voice-picker');
      picker.innerHTML = '';

      if (availableVoices.length === 0) {
        const opt = document.createElement('option');
        opt.text = 'Default System Voice';
        picker.appendChild(opt);
        return;
      }

      // Find dedicated voices:
      // 1. UK Voice for Pip ONLY
      ukPipVoice = availableVoices.find(v => v.lang.includes('GB') || v.lang.includes('UK') || v.name.toLowerCase().includes('george') || v.name.toLowerCase().includes('libby'));

      // 2. US Female Voice for Maya & Granny
      femaleVoice = availableVoices.find(v => (v.lang.includes('US') || v.lang.includes('en')) && (v.name.toLowerCase().includes('jenny') || v.name.toLowerCase().includes('aria') || v.name.toLowerCase().includes('zira') || v.name.toLowerCase().includes('female')));

      // 3. US Male Voice for Titan & Barnaby
      deepVoice = availableVoices.find(v => (v.lang.includes('US') || v.lang.includes('en')) && (v.name.toLowerCase().includes('guy') || v.name.toLowerCase().includes('david') || v.name.toLowerCase().includes('mark') || v.name.toLowerCase().includes('male')));

      // 4. Best Natural Narrator Voice (US English prioritized)
      const usVoices = availableVoices.filter(v => v.lang.includes('US') || !v.lang.includes('GB'));
      usVoices.sort((a, b) => {
        const score = v => {
          const n = v.name.toLowerCase();
          if (n.includes('natural') || n.includes('neural')) return 100;
          if (n.includes('online')) return 90;
          if (n.includes('google')) return 80;
          if (n.includes('jenny') || n.includes('guy') || n.includes('aria')) return 70;
          if (n.includes('david')) return 10;
          return 50;
        };
        return score(b) - score(a);
      });

      usVoices.forEach((v, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        let displayName = v.name.replace('Microsoft ', '').replace(' Desktop', '').replace(' Online (Natural)', ' (Natural)');
        opt.text = displayName;
        picker.appendChild(opt);
      });

      selectedNarratorVoice = usVoices[0] || availableVoices[0];
    }

    if (synth) {
      loadVoices();
      if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = loadVoices;
      }
    }

    function onVoiceChange() {
      const idx = document.getElementById('voice-picker').value;
      const usVoices = availableVoices.filter(v => v.lang.includes('US') || !v.lang.includes('GB'));
      selectedNarratorVoice = usVoices[idx] || availableVoices[0];
      if (isSpeaking) {
        stopSpeech();
        toggleSpeech();
      }
    }

    // Build Chapter Tabs
    const tabsContainer = document.getElementById('chapter-tabs');
    chapters.forEach(ch => {
      const btn = document.createElement('button');
      btn.className = 'ch-tab' + (ch.num === 1 ? ' active' : '');
      btn.id = 'tab-ch-' + ch.num;
      btn.innerText = 'Ch ' + ch.num + ': ' + ch.title;
      btn.onclick = () => {
        stopSpeech();
        renderScene(ch.first_scene);
      };
      tabsContainer.appendChild(btn);
    });

    // Render Scene Function with Marked Dialogue Spans
    function renderScene(sceneId) {
      const scene = allScenes[sceneId];
      if (!scene) return;
      currentSceneId = sceneId;

      document.querySelectorAll('.ch-tab').forEach(t => t.classList.remove('active'));
      const activeTab = document.getElementById('tab-ch-' + scene.chapter);
      if (activeTab) activeTab.classList.add('active');

      document.getElementById('card-ch-label').innerText = 'Chapter ' + scene.chapter + ' • ' + scene.chapter_title;
      document.getElementById('card-title').innerText = scene.title || 'Master Detective Pip';

      // Build text with distinct character badges & spans
      const textContainer = document.getElementById('card-text');
      textContainer.innerHTML = '';
      flatSegments = [];
      let globalSegCounter = 0;

      scene.paragraphs.forEach((pObj, pIdx) => {
        const pEl = document.createElement('p');
        pEl.className = 'para';
        pEl.id = 'para-' + pIdx;

        pObj.segments.forEach(seg => {
          const span = document.createElement('span');
          span.id = 'seg-' + globalSegCounter;
          const spk = characterProfiles[seg.speaker] || characterProfiles['narrator'];

          if (seg.is_quote) {
            span.className = 'dialogue-span speaker-' + seg.speaker;
            span.title = spk.name;
            span.innerHTML = '&ldquo;' + seg.text + '&rdquo; ';
          } else {
            span.className = 'narration-span';
            span.innerText = seg.text + ' ';
          }

          pEl.appendChild(span);

          flatSegments.push({
            idx: globalSegCounter,
            text: seg.text,
            speaker: seg.speaker,
            profile: spk,
            elId: 'seg-' + globalSegCounter
          });

          globalSegCounter++;
        });

        textContainer.appendChild(pEl);
      });

      // Image
      const imgBox = document.getElementById('card-image-box');
      if (scene.image && scene.image.src) {
        document.getElementById('card-img').src = scene.image.src;
        document.getElementById('card-caption').innerText = scene.image.alt || '';
        imgBox.style.display = 'block';
      } else {
        imgBox.style.display = 'none';
      }

      // Choices
      const choicesContainer = document.getElementById('card-choices');
      choicesContainer.innerHTML = '';
      if (scene.choices && scene.choices.length > 0) {
        scene.choices.forEach((c, idx) => {
          const btn = document.createElement('button');
          btn.className = 'btn-choice';
          const label = (c.label && c.label.standard) ? c.label.standard : (c.label || 'Continue');
          const isNext = label.toLowerCase().includes('turn') || label.toLowerCase().includes('page') || label.toLowerCase().includes('next');
          btn.innerHTML = '<span class="badge-icon">' + (isNext ? '→' : String.fromCharCode(65 + idx)) + '</span><span>' + label + '</span>';
          btn.onclick = () => {
            stopSpeech();
            playChime(784, 'sine', 0.25);
            if (c.goto) renderScene(c.goto);
          };
          choicesContainer.appendChild(btn);
        });
      } else {
        const endBtn = document.createElement('button');
        endBtn.className = 'btn-choice';
        endBtn.innerHTML = '<span class="badge-icon">★</span><span>Return to Beginning</span>';
        endBtn.onclick = () => {
          stopSpeech();
          renderScene('c1p1');
        };
        choicesContainer.appendChild(endBtn);
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Reading Focus Ruler
    let rulerActive = false;
    const ruler = document.getElementById('ruler-box');
    function toggleRuler() {
      rulerActive = !rulerActive;
      ruler.style.display = rulerActive ? 'block' : 'none';
      document.getElementById('ruler-txt').innerText = rulerActive ? 'On' : 'Off';
      document.getElementById('btn-ruler').classList.toggle('active', rulerActive);
      playChime(520, 'triangle', 0.15);
    }
    window.addEventListener('mousemove', e => {
      if (rulerActive) ruler.style.top = (e.clientY - 27) + 'px';
    });
    window.addEventListener('touchmove', e => {
      if (rulerActive && e.touches.length > 0) {
        ruler.style.top = (e.touches[0].clientY - 27) + 'px';
      }
    });

    // Font Cycler
    let fontIndex = 0;
    const fontList = [
      { name: 'Lexend', cls: '' },
      { name: 'OpenDyslexic', cls: 'font-opendyslexic' },
      { name: 'Serif', cls: 'font-serif' }
    ];
    function cycleFont() {
      document.body.classList.remove('font-opendyslexic', 'font-serif');
      fontIndex = (fontIndex + 1) % fontList.length;
      if (fontList[fontIndex].cls) {
        document.body.classList.add(fontList[fontIndex].cls);
      }
      document.getElementById('font-txt').innerText = fontList[fontIndex].name;
      playChime(580, 'sine', 0.15);
    }

    // Sensory Tint Themes
    function setTheme(t) {
      document.body.classList.remove('theme-twilight', 'theme-parchment', 'theme-moss');
      document.querySelectorAll('.tint-dot').forEach(d => d.classList.remove('active'));
      if (t === 'parchment') {
        document.body.classList.add('theme-parchment');
        document.querySelectorAll('.tint-dot')[1].classList.add('active');
      } else if (t === 'moss') {
        document.body.classList.add('theme-moss');
        document.querySelectorAll('.tint-dot')[2].classList.add('active');
      } else {
        document.body.classList.add('theme-twilight');
        document.querySelectorAll('.tint-dot')[0].classList.add('active');
      }
      playChime(660, 'sine', 0.15);
    }

    // FULL-CAST DYNAMIC VOICE SWITCHING ENGINE
    function toggleSpeech() {
      if (!synth) {
        alert('Voice speech is not supported in this browser.');
        return;
      }
      if (isSpeaking) {
        stopSpeech();
        return;
      }
      if (flatSegments.length === 0) return;

      stopSpeech();
      isSpeaking = true;
      document.getElementById('btn-speak').innerText = '⏹️ Stop Voice';
      document.getElementById('btn-speak').classList.add('speaking');

      currentSegmentIdx = 0;
      playCurrentSegment();
    }

    function playCurrentSegment() {
      if (!isSpeaking || currentSegmentIdx >= flatSegments.length) {
        stopSpeech();
        return;
      }

      const seg = flatSegments[currentSegmentIdx];
      const utter = new SpeechSynthesisUtterance(seg.text);
      const prof = seg.profile;

      utter.pitch = prof.pitch;
      utter.rate = prof.rate;

      // Assign Voice by VoiceType:
      if (prof.voiceType === 'uk_pip') {
        // ONLY PIP GETS THE UK BRITISH ACCENT!
        if (ukPipVoice) utter.voice = ukPipVoice;
        else if (selectedNarratorVoice) utter.voice = selectedNarratorVoice;
      } else if (prof.voiceType === 'us_female') {
        // Maya & Granny get American Female
        if (femaleVoice) utter.voice = femaleVoice;
        else if (selectedNarratorVoice) utter.voice = selectedNarratorVoice;
      } else if (prof.voiceType === 'us_male') {
        // Titan & Barnaby get Deep American Male
        if (deepVoice) utter.voice = deepVoice;
        else if (selectedNarratorVoice) utter.voice = selectedNarratorVoice;
      } else {
        // Narrator & Hero get Natural American Narrator Voice
        if (selectedNarratorVoice) utter.voice = selectedNarratorVoice;
      }

      // Live Highlighting
      document.querySelectorAll('.speaking-highlight').forEach(el => el.classList.remove('speaking-highlight'));
      const activeEl = document.getElementById(seg.elId);
      if (activeEl) {
        activeEl.classList.add('speaking-highlight');
        activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      // Live Indicator
      const ind = document.getElementById('speaker-indicator');
      ind.innerHTML = '<span>' + prof.icon + '</span> Speaking: <strong>' + prof.name + '</strong>';

      utter.onend = () => {
        currentSegmentIdx++;
        playCurrentSegment();
      };
      utter.onerror = () => {
        currentSegmentIdx++;
        playCurrentSegment();
      };

      synth.speak(utter);
    }

    function stopSpeech() {
      if (synth) synth.cancel();
      isSpeaking = false;
      const btn = document.getElementById('btn-speak');
      if (btn) {
        btn.innerText = '🔊 Read Page Out Loud';
        btn.classList.remove('speaking');
      }
      document.querySelectorAll('.speaking-highlight').forEach(el => el.classList.remove('speaking-highlight'));
      const ind = document.getElementById('speaker-indicator');
      if (ind) ind.innerHTML = '<span>📖</span> Ready to Narrate';
    }

    // Synthesized Audio Chime (Zero External Sound Files)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playChime(f, type = 'sine', dur = 0.2) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(f, audioCtx.currentTime);
        g.gain.setValueAtTime(0.12, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    // Start with Scene 1
    renderScene('c1p1');
  </script>
</body>
