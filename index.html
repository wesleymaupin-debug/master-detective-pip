e of carved cobblestones. In summer, it must have carried mountain water to the village. Now, it was a solid highway of slick, blue-white ice suspended three hundred feet in the air.", "segments": [{"text": "Stretching across the canyon like the spine of a sleeping dragon was the Ancient Aqueduct—a massive, arched bridge of carved cobblestones. In summer, it must have carried mountain water to the village. Now, it was a solid highway of slick, blue-white ice suspended three hundred feet in the air.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Follow my lead, recruit,\" Pip whispered, pulling his trench coat tight and dropping into a theatrical crouch. \"Silent as an owl. Swift as an arctic shadow. Step precisely where I step.\"", "segments": [{"text": "Follow my lead, recruit,", "speaker": "pip", "is_quote": true}, {"text": "Pip whispered, pulling his trench coat tight and dropping into a theatrical crouch.", "speaker": "narrator", "is_quote": false}, {"text": "Silent as an owl. Swift as an arctic shadow. Step precisely where I step.", "speaker": "pip", "is_quote": true}]}, {"raw": "Pip took three stealthy, exaggerated tiptoe steps out onto the ice.", "segments": [{"text": "Pip took three stealthy, exaggerated tiptoe steps out onto the ice.", "speaker": "narrator", "is_quote": false}]}, {"raw": "SQUEAK. SQUEAK. SQUEAK.", "segments": [{"text": "SQUEAK. SQUEAK. SQUEAK.", "speaker": "narrator", "is_quote": false}]}, {"raw": "His rubber boots made a noise like two wet balloons rubbing together.", "segments": [{"text": "His rubber boots made a noise like two wet balloons rubbing together.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Pip, your boots are squeaking,\" you whisper.", "segments": [{"text": "Pip, your boots are squeaking,", "speaker": "hero", "is_quote": true}, {"text": "you whisper.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"They are not squeaking,\" Pip hissed back without turning around. \"They are providing audible confirmation of tactical friction—\"", "segments": [{"text": "They are not squeaking,", "speaker": "pip", "is_quote": true}, {"text": "Pip hissed back without turning around.", "speaker": "narrator", "is_quote": false}, {"text": "They are providing audible confirmation of tactical friction—", "speaker": "pip", "is_quote": true}]}, {"raw": "SNAP!", "segments": [{"text": "SNAP!", "speaker": "narrator", "is_quote": false}]}, {"raw": "A blinding beam of harsh, brilliant white light hit you both from the darkness above!", "segments": [{"text": "A blinding beam of harsh, brilliant white light hit you both from the darkness above!", "speaker": "narrator", "is_quote": false}]}, {"raw": "High on the mountain crag, a clockwork searchlight tower had swiveled in your direction. The light was so bright you had to shield your eyes with your mitten.", "segments": [{"text": "High on the mountain crag, a clockwork searchlight tower had swiveled in your direction. The light was so bright you had to shield your eyes with your mitten.", "speaker": "narrator", "is_quote": false}]}, {"raw": "A piercing brass steam-whistle shrieked into the freezing night air:", "segments": [{"text": "A piercing brass steam-whistle shrieked into the freezing night air:", "speaker": "narrator", "is_quote": false}]}, {"raw": "WHOOOOO-EEEE-CLANG-CLANG!", "segments": [{"text": "WHOOOOO-EEEE-CLANG-CLANG!", "speaker": "narrator", "is_quote": false}]}, {"raw": "A mechanical voice boomed from the watchtower horn, rattling the icicles under the bridge:", "segments": [{"text": "A mechanical voice boomed from the watchtower horn, rattling the icicles under the bridge:", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"CURFEW PROTOCOL THIRTEEN INITIATED! UNAUTHORIZED SHADOWS ON HIGH SPAN! DEPLOY SEIZURE PATROLS!\"", "segments": [{"text": "CURFEW PROTOCOL THIRTEEN INITIATED! UNAUTHORIZED SHADOWS ON HIGH SPAN! DEPLOY SEIZURE PATROLS!", "speaker": "narrator", "is_quote": true}]}, {"raw": "Heavy wooden thuds echoed from both sides of the aqueduct. Marching onto the bridge from the north and south were squads of clockwork sentries, their crimson coats glowing under the searchlight beams, their brass bayonets raised and humming with purple electricity.", "segments": [{"text": "Heavy wooden thuds echoed from both sides of the aqueduct. Marching onto the bridge from the north and south were squads of clockwork sentries, their crimson coats glowing under the searchlight beams, their brass bayonets raised and humming with purple electricity.", "speaker": "narrator", "is_quote": false}]}, {"raw": "You're trapped in the middle of a frozen bridge three hundred feet above the valley floor.", "segments": [{"text": "You're trapped in the middle of a frozen bridge three hundred feet above the valley floor.", "speaker": "narrator", "is_quote": false}]}], "image": {"src": "images/whispering_pines_first_person_1795379843042.jpg", "alt": "Illustration: The Whispering Pines (First-Person POV)"}, "choices": [{"id": "c2p3_next", "label": {"standard": "Turn the page", "short": "Turn the page"}, "goto": "c2p4"}]}, "c2p4": {"id": "c2p4", "chapter": 2, "chapter_title": "The Whispering Pines & The Clockmaker's Vault", "title": "The Great Sled Escape", "paragraphs": [{"raw": "\"Pip!\" you shout over the wailing sirens. \"They're on both sides of the bridge! What do we do?!\"", "segments": [{"text": "Pip!", "speaker": "hero", "is_quote": true}, {"text": "you shout over the wailing sirens.", "speaker": "narrator", "is_quote": false}, {"text": "They're on both sides of the bridge! What do we do?!", "speaker": "hero", "is_quote": true}]}, {"raw": "Pip stood up, dusted off his lapels, and adjusted his crooked detective cap with absolute, unshakable swagger.", "segments": [{"text": "Pip stood up, dusted off his lapels, and adjusted his crooked detective cap with absolute, unshakable swagger.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Do not fret, young colleague!\" Pip announced in his finest, most aristocratic British cadence. \"Master Detective Pip has already calculated our optimal vectors! I have conceived a one-hundred-percent foolproof, mathematically flawless tactical extraction!\"", "segments": [{"text": "Do not fret, young colleague!", "speaker": "pip", "is_quote": true}, {"text": "Pip announced in his finest, most aristocratic British cadence.", "speaker": "narrator", "is_quote": false}, {"text": "Master Detective Pip has already calculated our optimal vectors! I have conceived a one-hundred-percent foolproof, mathematically flawless tactical extraction!", "speaker": "pip", "is_quote": true}]}, {"raw": "\"What extraction?!\"", "segments": [{"text": "What extraction?!", "speaker": "narrator", "is_quote": true}]}, {"raw": "\"Behold!\" Pip declared, pointing dramatically toward the canyon rim. \"Just beyond this ledge lies a battered old cargo sled! We shall execute a synchronized, acrobatic leap, engage the steering runners for controlled deceleration, and gracefully—\"", "segments": [{"text": "Behold!", "speaker": "pip", "is_quote": true}, {"text": "Pip declared, pointing dramatically toward the canyon rim.", "speaker": "narrator", "is_quote": false}, {"text": "Just beyond this ledge lies a battered old cargo sled! We shall execute a synchronized, acrobatic leap, engage the steering runners for controlled deceleration, and gracefully—", "speaker": "pip", "is_quote": true}]}, {"raw": "Pip took a grand, heroic step forward.", "segments": [{"text": "Pip took a grand, heroic step forward.", "speaker": "narrator", "is_quote": false}]}, {"raw": "His hind boot planted squarely on the trailing fringe of his four-foot red knit scarf.", "segments": [{"text": "His hind boot planted squarely on the trailing fringe of his four-foot red knit scarf.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Pip's eyes bulged out of his furry head.", "segments": [{"text": "Pip's eyes bulged out of his furry head.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"OH GINGER-SNAPS—\"", "segments": [{"text": "OH GINGER-SNAPS—", "speaker": "narrator", "is_quote": true}]}, {"raw": "Pip’s paws windmilled in the air. In a blind panic, he lunged forward, grabbed you by the front of your jacket, and you both tumbled over the ledge, crashing directly onto the battered wooden cargo sled!", "segments": [{"text": "Pip’s paws windmilled in the air. In a blind panic, he lunged forward, grabbed you by the front of your jacket, and you both tumbled over the ledge, crashing directly onto the battered wooden cargo sled!", "speaker": "narrator", "is_quote": false}]}, {"raw": "KER-SLAM!", "segments": [{"text": "KER-SLAM!", "speaker": "narrator", "is_quote": false}]}, {"raw": "The rusty iron runners broke free from the ice with a loud CRACK.", "segments": [{"text": "The rusty iron runners broke free from the ice with a loud CRACK.", "speaker": "narrator", "is_quote": false}]}, {"raw": "The sled shot down the steep wooden timber flume like a rocket!", "segments": [{"text": "The sled shot down the steep wooden timber flume like a rocket!", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"GRAB THE ROPES!\" you scream.", "segments": [{"text": "GRAB THE ROPES!", "speaker": "narrator", "is_quote": true}, {"text": "you scream.", "speaker": "narrator", "is_quote": false}]}, {"raw": "You grab the frozen steering ropes with both mittens, desperately trying to keep the sled from spinning off the edge.", "segments": [{"text": "You grab the frozen steering ropes with both mittens, desperately trying to keep the sled from spinning off the edge.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Pip didn't land in the seat. He tumbled head-first into the curved front nose of the toboggan! His green coat bunched up around his ears, his little hind boots kicked frantically in the air, and his ENORMOUS, bushy, fluffy fox tail bounced violently right in front of your face!", "segments": [{"text": "Pip didn't land in the seat. He tumbled head-first into the curved front nose of the toboggan! His green coat bunched up around his ears, his little hind boots kicked frantically in the air, and his ENORMOUS, bushy, fluffy fox tail bounced violently right in front of your face!", "speaker": "narrator", "is_quote": false}]}, {"raw": "FLUMP-FLUMP-FLUMP!", "segments": [{"text": "FLUMP-FLUMP-FLUMP!", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"I CAN'T SEE!\" you yell, spitting red fox fur out of your mouth. \"PIP! YOUR TAIL IS IN MY EYES!\"", "segments": [{"text": "I CAN'T SEE!", "speaker": "pip", "is_quote": true}, {"text": "you yell, spitting red fox fur out of your mouth.", "speaker": "narrator", "is_quote": false}, {"text": "PIP! YOUR TAIL IS IN MY EYES!", "speaker": "pip", "is_quote": true}]}, {"raw": "From somewhere deep inside the front curve of the sled, a muffled, high-pitched squeak echoed back:", "segments": [{"text": "From somewhere deep inside the front curve of the sled, a muffled, high-pitched squeak echoed back:", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"WE’RE GOING THREE HUNDRED MILES AN HOUR! I CAN'T HEAR YOU OVER THE SOUND OF MY ENTIRE LIFE FLASHING BEFORE MY EYES! SAVE MY HAT!\"", "segments": [{"text": "WE’RE GOING THREE HUNDRED MILES AN HOUR! I CAN'T HEAR YOU OVER THE SOUND OF MY ENTIRE LIFE FLASHING BEFORE MY EYES! SAVE MY HAT!", "speaker": "narrator", "is_quote": true}]}, {"raw": "SWOOOOOOOOOSH!", "segments": [{"text": "SWOOOOOOOOOSH!", "speaker": "narrator", "is_quote": false}]}, {"raw": "The sled hit an icy seventy-degree bank, kicking up a blinding wall of glittering snow crystals! Searchlight beams whipped overhead through the dark pine canopy! You lean hard to the left, peering around Pip's wildly twitching tail just in time to see a frozen waterfall rushing toward you!", "segments": [{"text": "The sled hit an icy seventy-degree bank, kicking up a blinding wall of glittering snow crystals! Searchlight beams whipped overhead through the dark pine canopy! You lean hard to the left, peering around Pip's wildly twitching tail just in time to see a frozen waterfall rushing toward you!", "speaker": "narrator", "is_quote": false}]}, {"raw": "You yank the right rope with all your strength.", "segments": [{"text": "You yank the right rope with all your strength.", "speaker": "narrator", "is_quote": false}]}, {"raw": "The sled airborne—twenty feet through the air in a blur of red scarf, flying snow, and screaming fox—before burying itself directly into a thirty-foot mountain of powdery snow right at the foot of an enormous, frozen waterwheel!", "segments": [{"text": "The sled airborne—twenty feet through the air in a blur of red scarf, flying snow, and screaming fox—before burying itself directly into a thirty-foot mountain of powdery snow right at the foot of an enormous, frozen waterwheel!", "speaker": "narrator", "is_quote": false}]}, {"raw": "KER-BLAM!", "segments": [{"text": "KER-BLAM!", "speaker": "narrator", "is_quote": false}]}, {"raw": "A mushroom cloud of white powder exploded into the night.", "segments": [{"text": "A mushroom cloud of white powder exploded into the night.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Then... complete, dead silence.", "segments": [{"text": "Then... complete, dead silence.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Snowflakes gently drifted down from the frosted wooden eaves of the old mill.", "segments": [{"text": "Snowflakes gently drifted down from the frosted wooden eaves of the old mill.", "speaker": "narrator", "is_quote": false}]}, {"raw": "The wooden toboggan was wedged nose-down in the drift. Pip’s hind legs stopped kicking, slowly sank into the snow, and then popped out again like two furry twigs.", "segments": [{"text": "The wooden toboggan was wedged nose-down in the drift. Pip’s hind legs stopped kicking, slowly sank into the snow, and then popped out again like two furry twigs.", "speaker": "narrator", "is_quote": false}]}, {"raw": "With a loud SHWUCK, Pip yanked his head out of the snowdrift. His green coat was stuffed with snow, his ears were drooping, and his houndstooth cap was pulled down over his nose.", "segments": [{"text": "With a loud SHWUCK, Pip yanked his head out of the snowdrift. His green coat was stuffed with snow, his ears were drooping, and his houndstooth cap was pulled down over his nose.", "speaker": "narrator", "is_quote": false}]}, {"raw": "He spit out a mouthful of snow, cleared his throat, and looked at you with supreme, unbothered dignity:", "segments": [{"text": "He spit out a mouthful of snow, cleared his throat, and looked at you with supreme, unbothered dignity:", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Ahem. Flawless execution. A masterclass in gravimetric evasion.\"", "segments": [{"text": "Ahem. Flawless execution. A masterclass in gravimetric evasion.", "speaker": "narrator", "is_quote": true}]}, {"raw": "He pulled his cap up and brushed his whiskers.", "segments": [{"text": "He pulled his cap up and brushed his whiskers.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"You may applaud now.\"", "segments": [{"text": "You may applaud now.", "speaker": "narrator", "is_quote": true}]}], "image": {"src": "images/ch2_great_sled_escape_pov_v2_1795379791739.jpg", "alt": "Illustration: The Great Sled Escape (First-Person POV)"}, "choices": [{"id": "c2p4_next", "label": {"standard": "Turn the page", "short": "Turn the page"}, "goto": "c2p5"}]}, "c2p5": {"id": "c2p5", "chapter": 2, "chapter_title": "The Whispering Pines & The Clockmaker's Vault", "title": "The Master Detective's Headquarters", "paragraphs": [{"raw": "Pip pushed open the heavy wooden door, and you slipped inside the Old Clockwork Mill.", "segments": [{"text": "Pip pushed open the heavy wooden door, and you slipped inside the Old Clockwork Mill.", "speaker": "narrator", "is_quote": false}]}, {"raw": "The interior was massive, silent, and smelling of ancient cedar, machine oil, and cold river stone. Overhead, giant wooden gears the size of Ferris wheels hung suspended from the rafters, frozen in time and draped in thick silver spiderwebs. In the center of the room, a massive iron drive-shaft dropped straight through the floor into the icy depths of the frozen river below.", "segments": [{"text": "The interior was massive, silent, and smelling of ancient cedar, machine oil, and cold river stone. Overhead, giant wooden gears the size of Ferris wheels hung suspended from the rafters, frozen in time and draped in thick silver spiderwebs. In the center of the room, a massive iron drive-shaft dropped straight through the floor into the icy depths of the frozen river below.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Follow me, recruit,\" Pip whispered, gesturing toward a creaky spiral staircase of notched timber. \"Mind the seventh step. It squeaks in B-flat.\"", "segments": [{"text": "Follow me, recruit,", "speaker": "pip", "is_quote": true}, {"text": "Pip whispered, gesturing toward a creaky spiral staircase of notched timber.", "speaker": "narrator", "is_quote": false}, {"text": "Mind the seventh step. It squeaks in B-flat.", "speaker": "pip", "is_quote": true}]}, {"raw": "You follow Pip up to the loft, and your jaw drops.", "segments": [{"text": "You follow Pip up to the loft, and your jaw drops.", "speaker": "narrator", "is_quote": false}]}, {"raw": "This was clearly where Pip lived—and worked:", "segments": [{"text": "This was clearly where Pip lived—and worked:", "speaker": "narrator", "is_quote": false}]}, {"raw": "Hanging across the back wall was a massive green chalkboard covered in frantic chalk scribbles, question marks, and messy loops of red yarn connecting bizarre newspaper clippings (\"IS SANTA AN ILLUSION?\", \"WHERE DO THE MISSING HOURS GO?\", \"WHO STOLE MY SHORTBREAD?\").", "segments": [{"text": "Hanging across the back wall was a massive green chalkboard covered in frantic chalk scribbles, question marks, and messy loops of red yarn connecting bizarre newspaper clippings (", "speaker": "narrator", "is_quote": false}, {"text": "IS SANTA AN ILLUSION?", "speaker": "narrator", "is_quote": true}, {"text": ",", "speaker": "narrator", "is_quote": false}, {"text": "WHERE DO THE MISSING HOURS GO?", "speaker": "narrator", "is_quote": true}, {"text": ",", "speaker": "narrator", "is_quote": false}, {"text": "WHO STOLE MY SHORTBREAD?", "speaker": "narrator", "is_quote": true}, {"text": ").", "speaker": "narrator", "is_quote": false}]}, {"raw": "A small cast-iron stove in the corner was glowing with warm amber coals, heating a dented copper kettle that whistled softly.", "segments": [{"text": "A small cast-iron stove in the corner was glowing with warm amber coals, heating a dented copper kettle that whistled softly.", "speaker": "narrator", "is_quote": false}]}, {"raw": "A desk was buried under magnifying glasses, brass calipers, hollowed-out pocket watches, and half-eaten gingerbread men.", "segments": [{"text": "A desk was buried under magnifying glasses, brass calipers, hollowed-out pocket watches, and half-eaten gingerbread men.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Pip paced back and forth on his hind legs, his tail twitching in frustration.", "segments": [{"text": "Pip paced back and forth on his hind legs, his tail twitching in frustration.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"I don't understand it!\" Pip cried, throwing his furry paws in the air. \"The whisper said: 'When the thirteenth bell sighs, the cog turns where the cold river lies.' I have lived in this mill for two years! I have inspected every plank, every cobweb, every crumpet crumb! There is no secret cog in this room!\"", "segments": [{"text": "I don't understand it!", "speaker": "pip", "is_quote": true}, {"text": "Pip cried, throwing his furry paws in the air.", "speaker": "narrator", "is_quote": false}, {"text": "The whisper said: 'When the thirteenth bell sighs, the cog turns where the cold river lies.' I have lived in this mill for two years! I have inspected every plank, every cobweb, every crumpet crumb! There is no secret cog in this room!", "speaker": "pip", "is_quote": true}]}, {"raw": "You look around the dusty room. Your mind feels that familiar, quiet buzz—the part of your brain that always notices what other people walk right past.", "segments": [{"text": "You look around the dusty room. Your mind feels that familiar, quiet buzz—the part of your brain that always notices what other people walk right past.", "speaker": "narrator", "is_quote": false}]}, {"raw": "There is definitely something hidden here. You just need to know where to look.", "segments": [{"text": "There is definitely something hidden here. You just need to know where to look.", "speaker": "narrator", "is_quote": false}]}, {"raw": "What do you want to inspect first?", "segments": [{"text": "What do you want to inspect first?", "speaker": "narrator", "is_quote": false}]}], "image": {"src": "images/ch2_great_sled_escape_pov_v2_1795379791739.jpg", "alt": "Illustration: The Great Sled Escape (First-Person POV)"}, "choices": [{"id": "c2p5_a", "label": {"standard": "The Frosted Window looking out at the giant waterwheel.", "short": "The Frosted Window looking out at the giant waterwheel."}, "goto": "c2p6a"}, {"id": "c2p5_b", "label": {"standard": "The Cast-Iron Stove with the rattling copper kettle.", "short": "The Cast-Iron Stove with the rattling copper kettle."}, "goto": "c2p6b"}, {"id": "c2p5_c", "label": {"standard": "The Dusty Floorboards surrounding the giant central drive-shaft.", "short": "The Dusty Floorboards surrounding the giant central drive-shaft."}, "goto": "c2p6c"}]}, "c2p6a": {"id": "c2p6a", "chapter": 2, "chapter_title": "The Whispering Pines & The Clockmaker's Vault", "title": "The Frosted Window", "paragraphs": [{"raw": "You walk over to the small, circular window and use your mitten to wipe away the thick layer of frost. Outside, the fifty-foot wooden waterwheel is frozen solid in the river ice. But as moonlight hits the spokes, you notice something strange: the shadow cast by the wheel onto the mill wall doesn't match the wheel at all! The shadow reveals a hidden inner spoke—and it points directly at the iron stove in the corner!", "segments": [{"text": "You walk over to the small, circular window and use your mitten to wipe away the thick layer of frost. Outside, the fifty-foot wooden waterwheel is frozen solid in the river ice. But as moonlight hits the spokes, you notice something strange: the shadow cast by the wheel onto the mill wall doesn't match the wheel at all! The shadow reveals a hidden inner spoke—and it points directly at the iron stove in the corner!", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Pip!\" you say. \"Look at the shadow! It's pointing at your stove!\"", "segments": [{"text": "Pip!", "speaker": "hero", "is_quote": true}, {"text": "you say.", "speaker": "narrator", "is_quote": false}, {"text": "Look at the shadow! It's pointing at your stove!", "speaker": "hero", "is_quote": true}]}, {"raw": "\"Aha!\" Pip declares, bounding across the room. \"The stove! Naturally, I was keeping my tea warm on the primary control mechanism!\"", "segments": [{"text": "Aha!", "speaker": "pip", "is_quote": true}, {"text": "Pip declares, bounding across the room.", "speaker": "narrator", "is_quote": false}, {"text": "The stove! Naturally, I was keeping my tea warm on the primary control mechanism!", "speaker": "pip", "is_quote": true}]}], "image": {"src": "images/ch2_great_sled_escape_pov_v2_1795379791739.jpg", "alt": "Illustration: The Great Sled Escape (First-Person POV)"}, "choices": [{"id": "c2p6a_next", "label": {"standard": "Turn the page", "short": "Turn the page"}, "goto": "c2p6resolution"}]}, "c2p6b": {"id": "c2p6b", "chapter": 2, "chapter_title": "The Whispering Pines & The Clockmaker's Vault", "title": "The Cast-Iron Stove", "paragraphs": [{"raw": "You crouch by the little cast-iron stove. The copper pipe doesn't go up through the roof to vent smoke—it runs straight DOWN through the wooden floor!", "segments": [{"text": "You crouch by the little cast-iron stove. The copper pipe doesn't go up through the roof to vent smoke—it runs straight DOWN through the wooden floor!", "speaker": "narrator", "is_quote": false}]}, {"raw": "Pip rushes over. \"Careful, recruit, that's my emergency peppermint brew!\" Pip grabs the kettle handle, but his oversized sleeve catches on the stove's iron damper rod.", "segments": [{"text": "Pip rushes over.", "speaker": "narrator", "is_quote": false}, {"text": "Careful, recruit, that's my emergency peppermint brew!", "speaker": "pip", "is_quote": true}, {"text": "Pip grabs the kettle handle, but his oversized sleeve catches on the stove's iron damper rod.", "speaker": "narrator", "is_quote": false}]}, {"raw": "CLANK-CREEEAAAK!", "segments": [{"text": "CLANK-CREEEAAAK!", "speaker": "narrator", "is_quote": false}]}, {"raw": "Pip accidentally yanks the rod like a giant lever! The kettle rattles, a blast of compressed air shoots out from beneath the hearth, and a cloud of soot blows across the room—sweeping three inches of dust right off the floorboards around the central shaft!", "segments": [{"text": "Pip accidentally yanks the rod like a giant lever! The kettle rattles, a blast of compressed air shoots out from beneath the hearth, and a cloud of soot blows across the room—sweeping three inches of dust right off the floorboards around the central shaft!", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"GREAT CRACKERS!\" Pip yells, waving his paws in the soot. \"A deliberate tactical dusting!\"", "segments": [{"text": "GREAT CRACKERS!", "speaker": "pip", "is_quote": true}, {"text": "Pip yells, waving his paws in the soot.", "speaker": "narrator", "is_quote": false}, {"text": "A deliberate tactical dusting!", "speaker": "pip", "is_quote": true}]}], "image": {"src": "images/ch2_great_sled_escape_pov_v2_1795379791739.jpg", "alt": "Illustration: The Great Sled Escape (First-Person POV)"}, "choices": [{"id": "c2p6b_next", "label": {"standard": "Turn the page", "short": "Turn the page"}, "goto": "c2p6resolution"}]}, "c2p6c": {"id": "c2p6c", "chapter": 2, "chapter_title": "The Whispering Pines & The Clockmaker's Vault", "title": "The Dusty Floorboards", "paragraphs": [{"raw": "You kneel near the giant iron shaft in the center of the floor. You brush away the thick dust with your boot. The wooden planks aren't nailed down in straight lines—they're carved in concentric circles, like the face of an enormous wooden clock! Roman numerals are carved into the timber, from I to XII... and right at the bottom, an impossible numeral: XIII.", "segments": [{"text": "You kneel near the giant iron shaft in the center of the floor. You brush away the thick dust with your boot. The wooden planks aren't nailed down in straight lines—they're carved in concentric circles, like the face of an enormous wooden clock! Roman numerals are carved into the timber, from I to XII... and right at the bottom, an impossible numeral: XIII.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Pip!\" you shout. \"The floor is a clock dial!\"", "segments": [{"text": "Pip!", "speaker": "hero", "is_quote": true}, {"text": "you shout.", "speaker": "narrator", "is_quote": false}, {"text": "The floor is a clock dial!", "speaker": "hero", "is_quote": true}]}, {"raw": "\"I knew that!\" Pip shouts back, grabbing the stove rod. \"It just needed the master ignition engage-lever!\"", "segments": [{"text": "I knew that!", "speaker": "pip", "is_quote": true}, {"text": "Pip shouts back, grabbing the stove rod.", "speaker": "narrator", "is_quote": false}, {"text": "It just needed the master ignition engage-lever!", "speaker": "pip", "is_quote": true}]}], "image": {"src": "images/ch2_great_sled_escape_pov_v2_1795379791739.jpg", "alt": "Illustration: The Great Sled Escape (First-Person POV)"}, "choices": [{"id": "c2p6c_next", "label": {"standard": "Turn the page", "short": "Turn the page"}, "goto": "c2p6resolution"}]}, "c2p6resolution": {"id": "c2p6resolution", "chapter": 2, "chapter_title": "The Whispering Pines & The Clockmaker's Vault", "title": "The Trapdoor Opens", "paragraphs": [{"raw": "You and Pip stand over the circular floorboards.", "segments": [{"text": "You and Pip stand over the circular floorboards.", "speaker": "narrator", "is_quote": false}]}, {"raw": "With the stove lever engaged, the Roman numerals on the floor begin to hum with a soft, pulsing violet light. The number XIII clicks free.", "segments": [{"text": "With the stove lever engaged, the Roman numerals on the floor begin to hum with a soft, pulsing violet light. The number XIII clicks free.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Grab the iron ring!\" you tell Pip.", "segments": [{"text": "Grab the iron ring!", "speaker": "pip", "is_quote": true}, {"text": "you tell Pip.", "speaker": "narrator", "is_quote": false}]}, {"raw": "You and Pip both grab the cold iron ring embedded in the numeral XIII and pull with all your strength.", "segments": [{"text": "You and Pip both grab the cold iron ring embedded in the numeral XIII and pull with all your strength.", "speaker": "narrator", "is_quote": false}]}, {"raw": "GRRRRRR-CLANK-CLICK!", "segments": [{"text": "GRRRRRR-CLANK-CLICK!", "speaker": "narrator", "is_quote": false}]}, {"raw": "The circular floorboards rotate with the heavy grind of ancient stone. A section of the floor slides open like a puzzle box, revealing a narrow flight of spiral stone stairs descending deep beneath the frozen river.", "segments": [{"text": "The circular floorboards rotate with the heavy grind of ancient stone. A section of the floor slides open like a puzzle box, revealing a narrow flight of spiral stone stairs descending deep beneath the frozen river.", "speaker": "narrator", "is_quote": false}]}, {"raw": "From the darkness below rises the smell of cold river water, ozone, and old parchment.", "segments": [{"text": "From the darkness below rises the smell of cold river water, ozone, and old parchment.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Pip pulls his crooked hat down tight. His eyes are wide with wonder.", "segments": [{"text": "Pip pulls his crooked hat down tight. His eyes are wide with wonder.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Well, well, young recruit,\" Pip whispers softly. \"It appears our little case has just officially gone underground.\"", "segments": [{"text": "Well, well, young recruit,", "speaker": "pip", "is_quote": true}, {"text": "Pip whispers softly.", "speaker": "narrator", "is_quote": false}, {"text": "It appears our little case has just officially gone underground.", "speaker": "pip", "is_quote": true}]}], "image": {"src": "images/ch2_great_sled_escape_pov_v2_1795379791739.jpg", "alt": "Illustration: The Great Sled Escape (First-Person POV)"}, "choices": [{"id": "c2p6resolution_next", "label": {"standard": "Turn the page", "short": "Turn the page"}, "goto": "c2p7"}]}, "c2p7": {"id": "c2p7", "chapter": 2, "chapter_title": "The Whispering Pines & The Clockmaker's Vault", "title": "The Clockmaker's Vault", "paragraphs": [{"raw": "You and Pip climb down the stone steps beneath the frozen mill.", "segments": [{"text": "You and Pip climb down the stone steps beneath the frozen mill.", "speaker": "narrator", "is_quote": false}]}, {"raw": "At the bottom is a hidden subterranean chamber carved out of solid river bedrock. The ceiling is reinforced with massive, frost-covered oak beams. Through thick blocks of green river ice set into the walls, you can see frozen fish suspended motionless in the current.", "segments": [{"text": "At the bottom is a hidden subterranean chamber carved out of solid river bedrock. The ceiling is reinforced with massive, frost-covered oak beams. Through thick blocks of green river ice set into the walls, you can see frozen fish suspended motionless in the current.", "speaker": "narrator", "is_quote": false}]}, {"raw": "In the center of the chamber sits an ancient, heavy oak workbench.", "segments": [{"text": "In the center of the chamber sits an ancient, heavy oak workbench.", "speaker": "narrator", "is_quote": false}]}, {"raw": "It is covered in delicate, gleaming tools: brass tweezers, magnifying lenses, miniature anvils, and racks of tiny glass vials filled with glowing, swirling purple liquid—the exact same color as the Cheer Hearth in Arizona!", "segments": [{"text": "It is covered in delicate, gleaming tools: brass tweezers, magnifying lenses, miniature anvils, and racks of tiny glass vials filled with glowing, swirling purple liquid—the exact same color as the Cheer Hearth in Arizona!", "speaker": "narrator", "is_quote": false}]}, {"raw": "Pip creeps up to the table, his nose twitching. \"Good heavens. Someone has been modifying Everfrost's clockwork down here. In secret.\"", "segments": [{"text": "Pip creeps up to the table, his nose twitching.", "speaker": "narrator", "is_quote": false}, {"text": "Good heavens. Someone has been modifying Everfrost's clockwork down here. In secret.", "speaker": "pip", "is_quote": true}]}, {"raw": "You walk around the bench. Resting in the center of the desk is a thick, leather-bound journal bound with tarnished silver clasps. On the front cover, two ornate letters are stamped in worn gold foil:", "segments": [{"text": "You walk around the bench. Resting in the center of the desk is a thick, leather-bound journal bound with tarnished silver clasps. On the front cover, two ornate letters are stamped in worn gold foil:", "speaker": "narrator", "is_quote": false}]}, {"raw": "C. M.", "segments": [{"text": "C. M.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Pip,\" you whisper. \"Whose journal is this?\"", "segments": [{"text": "Pip,", "speaker": "hero", "is_quote": true}, {"text": "you whisper.", "speaker": "narrator", "is_quote": false}, {"text": "Whose journal is this?", "speaker": "hero", "is_quote": true}]}, {"raw": "Pip steps up beside you on his tiptoes. With trembling paws, he unclasps the silver latch and opens to the final, yellowed page. The handwriting is sharp, precise, and filled with deep, jagged ink strokes:", "segments": [{"text": "Pip steps up beside you on his tiptoes. With trembling paws, he unclasps the silver latch and opens to the final, yellowed page. The handwriting is sharp, precise, and filled with deep, jagged ink strokes:", "speaker": "narrator", "is_quote": false}]}, {"raw": "December 24, 1842.", "segments": [{"text": "December 24, 1842.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Santa receives the songs, the children's laughter, the warm hearths, and the world's adoration. And what am I? I am the Clockmaker. The man in the grease and shadows. The forgotten architect who keeps his great machine from tearing the world apart.", "segments": [{"text": "Santa receives the songs, the children's laughter, the warm hearths, and the world's adoration. And what am I? I am the Clockmaker. The man in the grease and shadows. The forgotten architect who keeps his great machine from tearing the world apart.", "speaker": "narrator", "is_quote": false}]}, {"raw": "No more.", "segments": [{"text": "No more.", "speaker": "narrator", "is_quote": false}]}, {"raw": "If humanity loves his Christmas so dearly, I shall give it to them forever. The Great Clock will turn back the hours, unspooling yesterday, until every season, every memory, and every ordinary day is swallowed by the frost.", "segments": [{"text": "If humanity loves his Christmas so dearly, I shall give it to them forever. The Great Clock will turn back the hours, unspooling yesterday, until every season, every memory, and every ordinary day is swallowed by the frost.", "speaker": "narrator", "is_quote": false}]}, {"raw": "They will finally remember who gave them eternity.", "segments": [{"text": "They will finally remember who gave them eternity.", "speaker": "narrator", "is_quote": false}]}, {"raw": "— C.M.", "segments": [{"text": "— C.M.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Silence fills the cold vault.", "segments": [{"text": "Silence fills the cold vault.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Pip’s jaw dropped open. His paws shook so hard the pages of the journal fluttered.", "segments": [{"text": "Pip’s jaw dropped open. His paws shook so hard the pages of the journal fluttered.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Santa... Santa had a partner?\" Pip whispered, his accent completely gone in sheer disbelief. \"The Clockmaker... he didn't just sabotage the clock. He built it.\"", "segments": [{"text": "Santa... Santa had a partner?", "speaker": "pip", "is_quote": true}, {"text": "Pip whispered, his accent completely gone in sheer disbelief.", "speaker": "narrator", "is_quote": false}, {"text": "The Clockmaker... he didn't just sabotage the clock. He built it.", "speaker": "pip", "is_quote": true}]}, {"raw": "Before you can answer, the stone floor violently trembles!", "segments": [{"text": "Before you can answer, the stone floor violently trembles!", "speaker": "narrator", "is_quote": false}]}, {"raw": "BOOOOOM.", "segments": [{"text": "BOOOOOM.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Deep within the riverbed, the iron drive-shaft groans. Up above, the distant Grand Clock chimes its next backwards hour.", "segments": [{"text": "Deep within the riverbed, the iron drive-shaft groans. Up above, the distant Grand Clock chimes its next backwards hour.", "speaker": "narrator", "is_quote": false}]}, {"raw": "BONG.", "segments": [{"text": "BONG.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Twelve.", "segments": [{"text": "Twelve.", "speaker": "narrator", "is_quote": false}]}, {"raw": "A warning bell begins to clang on the workbench. A small brass speaker horn crackles to life on the wall, and a familiar, overly cheerful wooden voice echoes through the room:", "segments": [{"text": "A warning bell begins to clang on the workbench. A small brass speaker horn crackles to life on the wall, and a familiar, overly cheerful wooden voice echoes through the room:", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"VAULT TAMPERING DETECTED AT SUB-SECTOR WATERMILL. DISPATCHING NUTCRACKER SPECIAL CONTINGENT.\"", "segments": [{"text": "VAULT TAMPERING DETECTED AT SUB-SECTOR WATERMILL. DISPATCHING NUTCRACKER SPECIAL CONTINGENT.", "speaker": "narrator", "is_quote": true}]}, {"raw": "Pip snaps the journal shut and shoves it into his coat. He looks up at you with wide, frantic eyes.", "segments": [{"text": "Pip snaps the journal shut and shoves it into his coat. He looks up at you with wide, frantic eyes.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"We need to move,\" Pip gasps. \"Right now.\"", "segments": [{"text": "We need to move,", "speaker": "pip", "is_quote": true}, {"text": "Pip gasps.", "speaker": "narrator", "is_quote": false}, {"text": "Right now.", "speaker": "pip", "is_quote": true}]}], "image": {"src": "images/ch2_illustration3_secret_vault_1795409125188.jpg", "alt": "Illustration: The Clockmaker's Secret Vault"}, "choices": [{"id": "c2p7_next", "label": {"standard": "Turn the page", "short": "Turn the page"}, "goto": "c3p1"}]}, "c3p1": {"id": "c3p1", "chapter": 3, "chapter_title": "Flight of the Peppermint Balloon", "title": "The Vault Showdown", "paragraphs": [{"raw": "THUD-THUD-THUD!", "segments": [{"text": "THUD-THUD-THUD!", "speaker": "narrator", "is_quote": false}]}, {"raw": "Heavy wooden boots echoed down the spiral stone staircase.", "segments": [{"text": "Heavy wooden boots echoed down the spiral stone staircase.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"SEARCH SQUAD ADVANCING!\" a cheery mechanical voice chirped from the shadows. \"COMMENCE THOROUGH HOLIDAY APPREHENSION!\"", "segments": [{"text": "SEARCH SQUAD ADVANCING!", "speaker": "narrator", "is_quote": true}, {"text": "a cheery mechanical voice chirped from the shadows.", "speaker": "narrator", "is_quote": false}, {"text": "COMMENCE THOROUGH HOLIDAY APPREHENSION!", "speaker": "narrator", "is_quote": true}]}, {"raw": "Three towering Nutcracker guards rounded the corner of the subterranean vault. These weren't ordinary sentries—they were the Nutcracker Special Contingent. They wore midnight-blue dress coats with polished silver tassels, tall bear-fur hats, and massive silver keys slowly turning in their backs: click-click-click.", "segments": [{"text": "Three towering Nutcracker guards rounded the corner of the subterranean vault. These weren't ordinary sentries—they were the Nutcracker Special Contingent. They wore midnight-blue dress coats with polished silver tassels, tall bear-fur hats, and massive silver keys slowly turning in their backs: click-click-click.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Their painted porcelain grins were so wide and shiny you could see your reflection in their teeth.", "segments": [{"text": "Their painted porcelain grins were so wide and shiny you could see your reflection in their teeth.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"UNAUTHORIZED CIVILIANS IN RESTRICTED CLOCK VAULT,\" the lead soldier announced with aggressive merriment. \"PREPARE TO RECEIVE FESTIVE CORRECTION.\"", "segments": [{"text": "UNAUTHORIZED CIVILIANS IN RESTRICTED CLOCK VAULT,", "speaker": "soldier", "is_quote": true}, {"text": "the lead soldier announced with aggressive merriment.", "speaker": "narrator", "is_quote": false}, {"text": "PREPARE TO RECEIVE FESTIVE CORRECTION.", "speaker": "soldier", "is_quote": true}]}, {"raw": "Pip squeezed behind your winter jacket, trembling so hard his detective hat slid over his left eye.", "segments": [{"text": "Pip squeezed behind your winter jacket, trembling so hard his detective hat slid over his left eye.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Right then, recruit,\" Pip squeaked, pushing the Clockmaker’s leather journal deeper into his coat pocket. \"I have thoroughly analyzed our tactical options. My official recommendation is that we scream, throw rocks, and faint in alphabetical order.\"", "segments": [{"text": "Right then, recruit,", "speaker": "pip", "is_quote": true}, {"text": "Pip squeaked, pushing the Clockmaker’s leather journal deeper into his coat pocket.", "speaker": "narrator", "is_quote": false}, {"text": "I have thoroughly analyzed our tactical options. My official recommendation is that we scream, throw rocks, and faint in alphabetical order.", "speaker": "pip", "is_quote": true}]}, {"raw": "\"No,\" you whisper, scanning the workbench. \"They're machines, Pip. They have rules. They can't help following their programming!\"", "segments": [{"text": "No,", "speaker": "hero", "is_quote": true}, {"text": "you whisper, scanning the workbench.", "speaker": "narrator", "is_quote": false}, {"text": "They're machines, Pip. They have rules. They can't help following their programming!", "speaker": "hero", "is_quote": true}]}, {"raw": "You spot three items within arm's reach on the workbench:", "segments": [{"text": "You spot three items within arm's reach on the workbench:", "speaker": "narrator", "is_quote": false}]}, {"raw": "An antique sprig of polished brass mistletoe with tiny jingle bells.", "segments": [{"text": "An antique sprig of polished brass mistletoe with tiny jingle bells.", "speaker": "narrator", "is_quote": false}]}, {"raw": "A beautifully wrapped, empty red holiday gift box with an elaborate golden silk bow.", "segments": [{"text": "A beautifully wrapped, empty red holiday gift box with an elaborate golden silk bow.", "speaker": "narrator", "is_quote": false}]}, {"raw": "A pair of long iron clock-tweezers right next to the soldiers' spinning back-keys.", "segments": [{"text": "A pair of long iron clock-tweezers right next to the soldiers' spinning back-keys.", "speaker": "narrator", "is_quote": false}]}, {"raw": "What silly trick do you use to stop the Nutcrackers?", "segments": [{"text": "What silly trick do you use to stop the Nutcrackers?", "speaker": "narrator", "is_quote": false}]}], "image": null, "choices": [{"id": "c3p1_a", "label": {"standard": "Grab the brass mistletoe and thrust it high into the air! (Trigger the Mandatory Etiquette Protocol!)", "short": "Grab the brass mistletoe and thrust it high into the air! (Trigger the Mandatory Etiquette Protocol!)"}, "goto": "c3p2a"}, {"id": "c3p1_b", "label": {"standard": "Shove the red wrapped present into the lead soldier's chest! (Trigger the 400-Point Ribbon Inspection Loop!)", "short": "Shove the red wrapped present into the lead soldier's chest! (Trigger the 400-Point Ribbon Inspection Loop!)"}, "goto": "c3p2b"}, {"id": "c3p1_c", "label": {"standard": "Grab the iron tweezers and flip the ratchet on their giant winding-keys! (Put them in reverse!)", "short": "Grab the iron tweezers and flip the ratchet on their giant winding-keys! (Put them in reverse!)"}, "goto": "c3p2c"}]}, "c3p2a": {"id": "c3p2a", "chapter": 3, "chapter_title": "Flight of the Peppermint Balloon", "title": "The Mistletoe Protocol", "paragraphs": [{"raw": "You grab the brass mistletoe off the workbench and thrust it high above your head!", "segments": [{"text": "You grab the brass mistletoe off the workbench and thrust it high above your head!", "speaker": "narrator", "is_quote": false}]}, {"raw": "JINGLE-JINGLE!", "segments": [{"text": "JINGLE-JINGLE!", "speaker": "narrator", "is_quote": false}]}, {"raw": "Instantly, the three soldiers freeze mid-stride. Their wooden jaws snap open, their glass eyes dilating in sheer panic.", "segments": [{"text": "Instantly, the three soldiers freeze mid-stride. Their wooden jaws snap open, their glass eyes dilating in sheer panic.", "speaker": "narrator", "is_quote": false}]}, {"raw": "BUZZZZ-CLICK-SPUTTER!", "segments": [{"text": "BUZZZZ-CLICK-SPUTTER!", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"CRI  shoulders, a big square head, and a brilliant white coat sprinkled with tiny black freckles across his muzzle and ears. He wore a shearling-lined leather bomber jacket, a fleece-lined aviator cap, and a pair of brass flight goggles perched over two big, soulful, chocolate-brown eyes. His little docked tail was clamped down tight in nervousness.", "speaker": "narrator", "is_quote": false}]}, {"raw": "When he stepped up to the edge of the basket, he looked so big and formidable that the Nutcrackers on the ground actually paused their marching in sheer intimidation.", "segments": [{"text": "When he stepped up to the edge of the basket, he looked so big and formidable that the Nutcrackers on the ground actually paused their marching in sheer intimidation.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Then the wicker basket bumped the mill chimney with a gentle thud.", "segments": [{"text": "Then the wicker basket bumped the mill chimney with a gentle thud.", "speaker": "narrator", "is_quote": false}]}, {"raw": "The giant bulldog let out a sharp, pathetic squeak:", "segments": [{"text": "The giant bulldog let out a sharp, pathetic squeak:", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"EEP!\"", "segments": [{"text": "EEP!", "speaker": "narrator", "is_quote": true}]}, {"raw": "He dropped flat onto his belly in the bottom of the basket, threw both of his massive, muscular white paws over his ears, and began shivering so violently the entire gondola rattled!", "segments": [{"text": "He dropped flat onto his belly in the bottom of the basket, threw both of his massive, muscular white paws over his ears, and began shivering so violently the entire gondola rattled!", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"O-Oh goodness! Oh crumpets and cocoa!\" the bulldog whimpered in a deep, booming voice that sounded like a giant bag of rocks being gently shaken. \"Tell me it was just a chimney! Tell me it wasn't an airborne snow-monster! Pip! Pip, are you down there?! I am having a medical crisis of pure fear!\"", "segments": [{"text": "O-Oh goodness! Oh crumpets and cocoa!", "speaker": "titan", "is_quote": true}, {"text": "the bulldog whimpered in a deep, booming voice that sounded like a giant bag of rocks being gently shaken.", "speaker": "narrator", "is_quote": false}, {"text": "Tell me it was just a chimney! Tell me it wasn't an airborne snow-monster! Pip! Pip, are you down there?! I am having a medical crisis of pure fear!", "speaker": "titan", "is_quote": true}]}, {"raw": "Pip scrambled across the snowy roof and grabbed the rim of the basket.", "segments": [{"text": "Pip scrambled across the snowy roof and grabbed the rim of the basket.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Titan! Pull yourself together, man! We are under active hostile fire!\"", "segments": [{"text": "Titan! Pull yourself together, man! We are under active hostile fire!", "speaker": "narrator", "is_quote": true}]}, {"raw": "The bulldog peeked one eye out from under his spotted ear. He spotted you, gasped, and tried to squeeze his giant body behind a tiny sandbag:", "segments": [{"text": "The bulldog peeked one eye out from under his spotted ear. He spotted you, gasped, and tried to squeeze his giant body behind a tiny sandbag:", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"A human?! A real human?! D-Do they bite?! Are they dangerous?!\"", "segments": [{"text": "A human?! A real human?! D-Do they bite?! Are they dangerous?!", "speaker": "narrator", "is_quote": true}]}, {"raw": "Down on the ground, the Nutcracker soldiers recovered from their shock and raised their brass staves!", "segments": [{"text": "Down on the ground, the Nutcracker soldiers recovered from their shock and raised their brass staves!", "speaker": "narrator", "is_quote": false}]}, {"raw": "CRACK-CRACK-CRACK!", "segments": [{"text": "CRACK-CRACK-CRACK!", "speaker": "narrator", "is_quote": false}]}, {"raw": "Luminous webs of sticky, glowing silver tinsel nets shot upward from the courtyard, latching onto the mill gutters and tearing toward the balloon basket!", "segments": [{"text": "Luminous webs of sticky, glowing silver tinsel nets shot upward from the courtyard, latching onto the mill gutters and tearing toward the balloon basket!", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Titan!\" Pip screamed, diving over the wicker rim. \"Engage the burners! Fly, you glorious coward, FLY!\"", "segments": [{"text": "Titan!", "speaker": "pip", "is_quote": true}, {"text": "Pip screamed, diving over the wicker rim.", "speaker": "narrator", "is_quote": false}, {"text": "Engage the burners! Fly, you glorious coward, FLY!", "speaker": "pip", "is_quote": true}]}], "image": null, "choices": [{"id": "c3p4_next", "label": {"standard": "Turn the page", "short": "Turn the page"}, "goto": "c3p5"}]}, "c3p5": {"id": "c3p5", "chapter": 3, "chapter_title": "Flight of the Peppermint Balloon", "title": "The Power of Nubbies", "paragraphs": [{"raw": "You scramble over the edge of the basket, tumbling onto the fleece floorboards right next to the giant shivering bulldog.", "segments": [{"text": "You scramble over the edge of the basket, tumbling onto the fleece floorboards right next to the giant shivering bulldog.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"I can't!\" Titan wailed, his big black-spotted jowls flapping as he buried his face in his paws. \"My paws are like jelly! The wind is windy! The dark is dark! My emotional constitution is compromised!\"", "segments": [{"text": "I can't!", "speaker": "titan", "is_quote": true}, {"text": "Titan wailed, his big black-spotted jowls flapping as he buried his face in his paws.", "speaker": "narrator", "is_quote": false}, {"text": "My paws are like jelly! The wind is windy! The dark is dark! My emotional constitution is compromised!", "speaker": "titan", "is_quote": true}]}, {"raw": "\"Titan, they're shooting nets at us!\" you yell, pointing over the side.",  your pocket for your family's puppy: crunchy, star-shaped holiday dog biscuits.", "segments": [{"text": "You look at your winter jacket. When you escaped your house in Arizona this morning, your mom had put a small plastic baggie in your pocket for your family's puppy: crunchy, star-shaped holiday dog biscuits.", "speaker": "narrator", "is_quote": false}]}, {"raw": "You rip open your pocket.", "segments": [{"text": "You rip open your pocket.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Titan!\" you shout, holding up a golden, crunchy star-shaped biscuit right in front of his big black nose. \"LOOK!\"", "segments": [{"text": "Titan!", "speaker": "hero", "is_quote": true}, {"text": "you shout, holding up a golden, crunchy star-shaped biscuit right in front of his big black nose.", "speaker": "narrator", "is_quote": false}, {"text": "LOOK!", "speaker": "hero", "is_quote": true}]}, {"raw": "Titan’s droopy eyes snapped open. His nostrils flared like two jet engines.", "segments": [{"text": "Titan’s droopy eyes snapped open. His nostrils flared like two jet engines.", "speaker": "narrator", "is_quote": false}]}, {"raw": "SNIIIIIIIIFFFF.", "segments": [{"text": "SNIIIIIIIIFFFF.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Is that...\" Titan whispered, his little docked tail giving a sudden, hopeful twitch. \"...an artisanal, oven-baked poultry-and-herb nubbie?\"", "segments": [{"text": "Is that...", "speaker": "titan", "is_quote": true}, {"text": "Titan whispered, his little docked tail giving a sudden, hopeful twitch.", "speaker": "narrator", "is_quote": false}, {"text": "...an artisanal, oven-baked poultry-and-herb nubbie?", "speaker": "titan", "is_quote": true}]}, {"raw": "\"It’s Thanksgiving turkey flavor,\" you say. \"And the whole bag is yours—plus as many ear scratches as you want—if you get us into the sky right now!\"", "segments": [{"text": "It’s Thanksgiving turkey flavor,", "speaker": "hero", "is_quote": true}, {"text": "you say.", "s st decipher the Clockmaker’s notes. The clock has struck twelve. Time is running backward. We need to know how to stop the primary escapement before Christmas Day.\"", "segments": [{"text": "Now then,", "speaker": "pip", "is_quote": true}, {"text": "Pip said solemnly.", "speaker": "narrator", "is_quote": false}, {"text": "We must decipher the Clockmaker’s notes. The clock has struck twelve. Time is running backward. We need to know how to stop the primary escapement before Christmas Day.", "speaker": "pip", "is_quote": true}]}, {"raw": "Titan leaned his massive head over the table, squinting through his flight goggles at the gold-embossed letters on the cover: C.M.", "segments": [{"text": "Titan leaned his massive head over the table, squinting through his flight goggles at the gold-embossed letters on the cover: C.M.", "speaker": "narrator", "is_quote": false}]}, {"raw": "Titan gasped. His little docked tail froze.", "segments": [{"text": "Titan gasped. His little docked tail froze.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Sweet mother of gravy...\" Titan whispered, his jowls quivering. \"That’s Barnaby's master's journal.\"", "segments": [{"text": "Sweet mother of gravy...", "speaker": "titan", "is_quote": true}, {"text": "Titan whispered, his jowls quivering.", "speaker": "narrator", "is_quote": false}, {"text": "That’s Barnaby's master's journal.", "speaker": "titan", "is_quote": true}]}, {"raw": "You and Pip both turn to look at him.", "segments": [{"text": "You and Pip both turn to look at him.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Who is Barnaby?\" you ask.", "segments": [{"text": "Who is Barnaby?", "speaker": "hero", "is_quote": true}, {"text": "you ask.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Barnaby Grumble,\" Titan whispered, looking nervously at the clouds as if someone might be listening. \"The old master clock-smith. Centurys ago, before Everfrost was built, Barnaby was the Clockmaker's only apprentice. He helped forge the original gears.\"", "segments": [{"text": "Barnaby Grumble,", "speaker": "titan", "is_quote": true}, {"text": "Titan whispered, looking nervously at the clouds as if someone might be listening.", "speaker": "narrator", "is_quote": false}, {"text": "The old master clock-smith. Centurys ago, before Everfrost was built, Barnaby was the Clockmaker's only apprentice. He helped forge the original gears.", "speaker": "titan", "is_quote": true}]}, {"raw": "\"An apprentice?!\" Pip shouted, his tail bristling. \"Where is he?! Why haven't I found him?!\"", "segments": [{"text": "An apprentice?!", "speaker": "pip", "is_quote": true}, {"text": "Pip shouted, his tail bristling.", "speaker": "narrator", "is_quote": false}, {"text": "Where is he?! Why haven't I found him?!", "speaker": "pip", "is_quote": true}]}, {"raw": "\"Because he's in hiding!\" Titan said. \"When the Clockmaker started going mad with jealousy, Barnaby tried to warn Santa. The Clockmaker locked Barnaby out, and now the Nutcrackers are hunting him. He's holed up in the Clockwork Scrap-Junkyard in the East Chasm. Nobody goes there. It's full of broken toys, guard traps, and... and spooky noises!\"", "segments": [{"text": "Because he's in hiding!", "speaker": "titan", "is_quote": true}, {"text": "Titan said.", "speaker": "narrator", "is_quote": false}, {"text": "When the Clockmaker started going mad with jealousy, Barnaby tried to warn Santa. The Clockmaker locked Barnaby out, and now the Nutcrackers are hunting him. He's holed up in the Clockwork Scrap-Junkyard in the East Chasm. Nobody goes there. It's full of broken toys, guard traps, and... and spooky noises!", "speaker": "titan", "is_quote": true}]}, {"raw": "Titan shivered, whimpered, and leaned all of his heavy weight into your lap for comfort.", "segments": [{"text": "Titan shivered, whimpered, and leaned all of his heavy weight into your lap for comfort.", "speaker": "narrator", "is_quote": false}]}, {"raw": "You smile, giving his big blocky head another warm scratch, and look out through the clouds at the jagged, icy peaks of the East Chasm.", "segments": [{"text": "You smile, giving his big blocky head another warm scratch, and look out through the clouds at the jagged, icy peaks of the East Chasm.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Titan,\" you say gently. \"Turn the balloon toward the East Chasm. We're going to meet Barnaby.\"", "segments": [{"text": "Titan,", "speaker": "hero", "is_quote": true}, {"text": "you say gently.", "speaker": "narrator", "is_quote": false}, {"text": "Turn the balloon toward the East Chasm. We're going to meet Barnaby.", "speaker": "hero", "is_quote": true}]}], "image": {"src": "images/ch3_illum2_soaring_over_everfrost_1795409173682.jpg", "alt": "Illustration: Soaring Over Everfrost — Nubbies & Ear Scratches"}, "choices": [{"id": "c3p6_next", "label": {"standard": "Turn the page", "short": "Turn the page"}, "goto": "c4p1"}]}, "c4p1": {"id": "c4p1", "chapter": 4, "chapter_title": "The Junk-Smith of East Chasm", "title": "The Mountain of Forgotten Gears", "paragraphs": [{"raw": "The peppermint balloon drifted down through the swirling snow of the East Chasm.", "segments": [{"text": "The peppermint balloon drifted down through the swirling snow of the East Chasm.", "speaker": "narrator", "is_quote": false}]}, {"raw": "The canyon walls were sheer cliffs of jagged black rock, but the canyon floor looked like an explosion in a colossal clock factory. Centuries of discarded machinery were piled fifty feet high: rusted iron balance wheels, giant brass pendulums, snapped springs, and mountains of hollow toy parts half-buried in the snow.", "segments": [{"text": "The canyon walls were sheer cliffs of jagged black rock, but the canyon floor looked like an explosion in a colossal clock factory. Centuries of discarded machinery were piled fifty feet high: rusted iron balance wheels, giant brass pendulums, snapped springs, and mountains of hollow toy parts half-buried in the snow.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Keep her steady, Titan,\" you say, peering over the wicker edge. \"Look for an entrance.\"", "segments": [{"text": "Keep her steady, Titan,", "speaker": "hero", "is_quote": true}, {"text": "you say, peering over the wicker edge.", "speaker": "narrator", "is_quote": false}, {"text": "Look for an entrance.", "speaker": "hero", "is_quote": true}]}, {"raw": "Titan set the balloon down on a snowy ledge right in front of a colossal, rusted vault door built directly into the cliff face. Above the door was a hand-painted wooden sign with crooked white lettering:", "segments": [{"text": "Titan set the balloon down on a snowy ledge right in front of a colossal, rusted vault door built directly into the cliff face. Above the door was a hand-painted wooden sign with crooked white lettering:", "speaker": "narrator", "is_quote": false}]}, {"raw": "PRIVATE PROPERTY. KEEP OUT. THIS MEANS YOU, NUTCRACKERS. AND ESPECIALLY YOU, SANTA.", "segments": [{"text": "PRIVATE PROPERTY. KEEP OUT. THIS MEANS YOU, NUTCRACKERS. AND ESPECIALLY YOU, SANTA.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"This is Barnaby's workshop,\" Titan whispered, his big black-spotted ears twitching nervously. \"He doesn't like visitors. Or noise. Or people who touch his stuff.\"", "segments": [{"text": "This is Barnaby's workshop,", "speaker": "titan", "is_quote": true}, {"text": "Titan whispered, his big black-spotted ears twitching nervously.", "speaker": "narrator", "is_quote": false}, {"text": "He doesn't like visitors. Or noise. Or people who touch his stuff.", "speaker": "titan", "is_quote": true}]}, {"raw": "Pip hopped out of the basket onto the snow, puffing his green trench coat out with grandiose pride.", "segments": [{"text": "Pip hopped out of the basket onto the snow, puffing his green trench coat out with grandiose pride.", "speaker": "narrator", "is_quote": false}]}, {"raw": "\"Nonsense!\" Pip declare
